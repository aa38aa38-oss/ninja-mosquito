<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>忍者蚊子 - 最終任務：把力維吸乾！</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #hud {
            position: absolute;
            top: max(15px, env(safe-area-inset-top, 15px));
            left: max(15px, env(safe-area-inset-left, 15px));
            width: 290px;
            max-width: 68vw;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 30;
        }
        #status-text { font-size: 15px; font-weight: bold; color: #ffeb3b; margin-bottom: 6px; white-space: nowrap; }
        .bar-container { margin-bottom: 4px; }
        .bar-label { font-size: 11px; margin-bottom: 2px; color: #ddd; }
        .progress-bg { width: 100%; height: 10px; background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 5px; overflow: hidden; }
        #essence-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff1744, #ff5252); }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #43a047, #76ff03); transition: width 0.08s ease-out; }
        #alert-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff9100, #d50000); transition: width 0.08s linear; }

        #dialog-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86%;
            max-width: 380px;
            max-height: 82dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: rgba(25, 15, 35, 0.96);
            border: 2px solid #e040fb;
            border-radius: 18px;
            padding: 22px 20px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 90;
            box-shadow: 0 0 25px rgba(224, 64, 251, 0.45);
            backdrop-filter: blur(10px);
        }
        #dialog-title { color: #e040fb; font-size: 19px; font-weight: 900; margin-bottom: 12px; text-align: center; }
        #dialog-content { font-size: 15px; line-height: 1.6; color: #eee; margin-bottom: 18px; text-align: center; white-space: pre-line; }
        .dialog-btn-group { display: flex; gap: 12px; justify-content: center; width: 100%; }
        .dialog-action-btn { padding: 10px 24px; background: linear-gradient(135deg, #d500f9, #aa00ff); border: none; border-radius: 22px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 12px rgba(213, 0, 249, 0.6); pointer-events: auto; touch-action: manipulation; }

        #qte-overlay { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); color: #ff1744; font-size: 26px; font-weight: 900; text-shadow: 0 0 10px #000, 0 0 20px #ff1744; display: none; z-index: 45; pointer-events: none; animation: pulse 0.15s infinite alternate; text-align: center; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1.0); } 100% { transform: translate(-50%, -50%) scale(1.15); } }
        #dodge-popup { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.8); color: #00e5ff; font-size: 32px; font-weight: 900; font-style: italic; text-shadow: 0 0 10px #000, 0 0 20px #00e5ff; display: none; z-index: 48; pointer-events: none; transition: transform 0.2s ease-out, opacity 0.3s ease-out; }

        #touch-left-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 55vw;
            height: 100%;
            height: 100dvh;
            z-index: 10;
            touch-action: none;
        }
        #arena-joystick { position: absolute; width: 140px; height: 140px; margin-left: -70px; margin-top: -70px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.45) 80%); border: 2px solid rgba(255, 255, 255, 0.3); box-shadow: 0 0 15px rgba(0, 0, 0, 0.6); pointer-events: none; display: none; z-index: 15; }
        #arena-knob { position: absolute; width: 56px; height: 56px; top: 42px; left: 42px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(200, 200, 200, 0.6) 100%); border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 0 12px rgba(255, 255, 255, 0.5); pointer-events: none; }

        #arena-action-pad {
            position: absolute;
            right: max(15px, env(safe-area-inset-right, 15px));
            bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
            width: 220px;
            height: 220px;
            z-index: 25;
            touch-action: none;
            pointer-events: none;
        }
        #suck-btn { position: absolute; right: 15px; bottom: 15px; width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle, rgba(229, 57, 53, 0.9) 0%, rgba(183, 28, 28, 0.95) 100%); border: 3px solid rgba(255, 138, 128, 0.85); box-shadow: 0 0 20px rgba(211, 47, 47, 0.7); color: #fff; font-size: 17px; font-weight: 900; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; transition: transform 0.08s ease; touch-action: manipulation; }
        #suck-btn:active, #suck-btn.pressed { transform: scale(0.92); background: radial-gradient(circle, rgba(255, 23, 68, 1) 0%, rgba(213, 0, 0, 1) 100%); }
        .skill-btn { position: absolute; width: 58px; height: 58px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; backdrop-filter: blur(4px); transition: transform 0.08s ease, filter 0.2s ease; touch-action: manipulation; }
        .skill-btn:active { transform: scale(0.9); }
        #blink-btn { right: 110px; bottom: 30px; background: radial-gradient(circle, rgba(0, 176, 255, 0.85) 0%, rgba(0, 145, 234, 0.95) 100%); border: 2px solid rgba(128, 222, 234, 0.9); box-shadow: 0 0 14px rgba(0, 176, 255, 0.6); }
        #stealth-btn { right: 105px; bottom: 105px; background: radial-gradient(circle, rgba(156, 39, 176, 0.85) 0%, rgba(106, 27, 154, 0.95) 100%); border: 2px solid rgba(206, 147, 216, 0.9); box-shadow: 0 0 14px rgba(156, 39, 176, 0.6); }
        #frenzy-btn { right: 30px; bottom: 115px; background: radial-gradient(circle, rgba(255, 111, 0, 0.85) 0%, rgba(230, 81, 0, 0.95) 100%); border: 2px solid rgba(255, 183, 77, 0.9); box-shadow: 0 0 14px rgba(255, 111, 0, 0.6); }
        .skill-locked { filter: grayscale(1); opacity: 0.55 !important; cursor: not-allowed; }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 95;
            color: #fff;
            backdrop-filter: blur(5px);
        }
        #death-title { font-size: 38px; font-weight: 900; color: #ff1744; letter-spacing: 2px; margin-bottom: 12px; }
        #death-reason { font-size: 16px; color: #eee; margin-bottom: 25px; max-width: 80%; text-align: center; line-height: 1.5; }
        .game-over-btn-group { display: flex; gap: 15px; }
        .over-btn { padding: 12px 30px; font-size: 16px; font-weight: bold; color: #fff; border-radius: 28px; cursor: pointer; transition: transform 0.1s ease; text-align: center; touch-action: manipulation; }
        #retry-btn { background: linear-gradient(135deg, #d50000, #ff5252); border: 2px solid #fff; box-shadow: 0 0 15px rgba(255, 82, 82, 0.6); }
        #home-btn { background: rgba(40, 40, 50, 0.85); border: 2px solid rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="dialog-modal">
        <div id="dialog-title">最終任務指引</div>
        <div id="dialog-content">最終任務：徹底把壽星吸乾！
右側米色衣服為壽星，左側胖子有劇毒！

新威脅注意：
青蛙、麻雀攻擊會【大幅消耗壽星精華液】！
善用【瞬移⚡】與【隱身術👻】保護精華！</div>
        <div class="dialog-btn-group">
            <button id="dialog-btn-1" class="dialog-action-btn">開吸！</button>
        </div>
    </div>

    <div id="touch-left-zone"></div>
    <div id="arena-joystick">
        <div id="arena-knob"></div>
    </div>

    <div id="qte-overlay">⚠️ 巨掌合圍！按【瞬移⚡】閃避！</div>
    <div id="dodge-popup">⚡ DODGE! 完美閃避！</div>

    <div id="hud">
        <div id="status-text">最終目標：鎖定右側米色衣服壽星</div>
        <div class="bar-container">
            <div class="bar-label">壽星精華液 (遭青蛙/麻雀擊中會流失！)</div>
            <div class="progress-bg"><div id="essence-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">蚊子生命值 (未吸血持續扣減)</div>
            <div class="progress-bg"><div id="health-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">暴露值 (高難度警備中)</div>
            <div class="progress-bg"><div id="alert-bar"></div></div>
        </div>
    </div>

    <div id="arena-action-pad">
        <div id="suck-btn">
            <span>💉</span>
            <span style="font-size:12px;">吸血</span>
        </div>
        <div id="blink-btn" class="skill-btn">
            <span>⚡</span>
            <span style="font-size:10px;">瞬移</span>
        </div>
        <div id="stealth-btn" class="skill-btn">
            <span>👻</span>
            <span style="font-size:10px;">隱身術</span>
        </div>
        <div id="frenzy-btn" class="skill-btn skill-locked">
            <span>🔒</span>
            <span style="font-size:10px;">狂吸</span>
        </div>
    </div>

    <div id="game-over-screen">
        <div id="death-title">啪！忍道終結</div>
        <div id="death-reason">壽星神掌從天而降...</div>
        <div class="game-over-btn-group">
            <div id="retry-btn" class="over-btn">重新挑戰</div>
            <div id="home-btn" class="over-btn">回首頁</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => {
    setTimeout(resize, 100);
});
resize();

const assets = {
    bg: new Image(),
    fly1: new Image(),
    fly2: new Image(),
    suck: new Image(),
    dizzy: new Image(),
    frog1: new Image(),
    frog2: new Image(),
    bird1: new Image(),
    bird2: new Image(),
    shadow1: new Image(),
    shadow2: new Image(),
    shadow1_alt: new Image(),
    shadow2_alt: new Image()
};

function isImgReady(img) {
    return img && img.complete && img.naturalWidth > 0;
}

function drawSafe(img, x, y, w, h) {
    if (isImgReady(img)) {
        try {
            ctx.drawImage(img, x, y, w, h);
            return true;
        } catch (e) {
            return false;
        }
    }
    return false;
}

const bgCandidates = ["bg_level2.png", "bg_level2.jpg", "bg_level2.jpeg", "bg_level2.PNG", "bg_level2.JPG"];
let bgCandidateIdx = 0;
function loadNextBg() {
    if (bgCandidateIdx < bgCandidates.length) {
        assets.bg.src = bgCandidates[bgCandidateIdx++];
    }
}
assets.bg.onerror = loadNextBg;
loadNextBg();

assets.fly1.src = "mosquito_fly_1.png";
assets.fly2.src = "mosquito_fly_2.png";
assets.suck.src = "mosquito_suck.png";
assets.dizzy.src = "mosquito_dizzy.png";
assets.frog1.src = "frog1.png";
assets.frog2.src = "frog2.png";
assets.bird1.src = "bird1.png";
assets.bird2.src = "bird2.png";
assets.shadow1.src = "shadow1.png";
assets.shadow2.src = "shadow2.png";
assets.shadow1_alt.src = "QQQ.png";
assets.shadow2_alt.src = "QQQ2.png";

let worldWidth = 1507;
let worldHeight = 798;
let hasInitialized = false;

function initGameOnce() {
    if (hasInitialized) return;
    hasInitialized = true;
    worldWidth = assets.bg.naturalWidth || 1507;
    worldHeight = assets.bg.naturalHeight || 798;
    resetGame();
    requestAnimationFrame(gameLoop);
}

assets.bg.onload = initGameOnce;
setTimeout(initGameOnce, 300);

const camera = { x: 0, y: 0, zoom: 2.6 };
const mosquito = { x: 351, y: 378, size: 36, speed: 300, facingRight: true, frame: 0, frameTimer: 0, isDead: false, deathType: "", invincibleTimer: 0 };

let essence = 0;
let health = 100;
let alertVal = 0;
let isSucking = false;

let blinkCooldown = 0;
let stealthCooldown = 0;
let stealthActiveTimer = 0;
let hasLearnedFrenzy = false;
let frenzyCooldown = 0;
let frenzyActiveTimer = 0;
let frenzyStartupTimer = 0;

let isStageComplete = false;
let joyVector = { x: 0, y: 0 };
let bloodParticles = [];
let blinkShadows = [];
let featherParticles = [];
let smokeParticles = [];

let hazards = [];
let hazardSpawnTimer = 0;
let bloodPacks = [];
let bloodPackSpawnTimer = 0;

let frogs = [];
let frogSpawnTimer = 0;
let birds = [];
let birdSpawnTimer = 0;

let windWaveTimer = 0;
let windWaveActive = false;
let windWaveX = -200;
let windWaveWarning = false;
let windWaveWarningTimer = 0;
const WIND_WARNING_DURATION = 1.8; // 完整 1.8 秒預警
let screenShakeTimer = 0;
let hurtFlashTimer = 0;
let essenceDrainFlashTimer = 0;
let qteActive = false;
let qteTimer = 0;
let slapHandsDist = 1.0;
let deathAnimTimer = 0;
let soulY = 0;

let isPausedForDialog = true;
let dialogStep = 1;
const dialogModal = document.getElementById("dialog-modal");
const dialogTitle = document.getElementById("dialog-title");
const dialogContent = document.getElementById("dialog-content");
const dialogBtn1 = document.getElementById("dialog-btn-1");

function handleBtn1Click(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (dialogStep === 1) {
        dialogModal.style.display = "none";
        isPausedForDialog = false;
    } else if (dialogStep === "UNLOCK_FRENZY") {
        dialogModal.style.display = "none";
        isPausedForDialog = false;
        frenzyStartupTimer = 0;
    } else if (dialogStep === "ALL_COMPLETE") {
        window.location.href = "ending.html";
    }
}
dialogBtn1.addEventListener("click", handleBtn1Click);
dialogBtn1.addEventListener("touchstart", handleBtn1Click, { passive: false });
dialogBtn1.addEventListener("pointerdown", handleBtn1Click);

function showUnlockFrenzyDialog() {
    isPausedForDialog = true;
    dialogStep = "UNLOCK_FRENZY";
    dialogTitle.innerText = "⚡ 領悟最終奧義！";
    dialogContent.innerText = "壽星精華液達到 10%！\n你已學會【奧義·大吸特吸🌪️】！\n按下後直接瞬移至壽星身邊自動吸血 1.8 秒，且完全不增加暴露值！";
    dialogBtn1.innerText = "大吸特吸！";
    dialogModal.style.display = "flex";
}

function showAllCompleteDialog() {
    isPausedForDialog = true;
    isStageComplete = true;
    dialogStep = "ALL_COMPLETE";
    dialogTitle.innerText = "👑 忍蚊傳說！大獲全勝！";
    dialogContent.innerText = "太狂了！你已經把壽星力維徹底吸乾！\n全部忍術大成，拯救了全場夜宴！";
    dialogBtn1.innerText = "前往謝幕與製作團隊";
    dialogModal.style.display = "flex";
}

function resetGame() {
    mosquito.x = 351; mosquito.y = 378; mosquito.isDead = false; mosquito.deathType = ""; mosquito.invincibleTimer = 0;
    camera.x = mosquito.x - (canvas.width / 2) / camera.zoom;
    camera.y = mosquito.y - (canvas.height / 2) / camera.zoom;
    essence = 0; health = 100; alertVal = 0; isSucking = false;
    blinkCooldown = 0; stealthCooldown = 0; stealthActiveTimer = 0;
    hasLearnedFrenzy = false; frenzyCooldown = 0; frenzyActiveTimer = 0; frenzyStartupTimer = 0; isStageComplete = false;
    updateSkillsUI();
    qteActive = false; qteTimer = 0; slapHandsDist = 1.0; deathAnimTimer = 0; soulY = 0;
    hurtFlashTimer = 0; essenceDrainFlashTimer = 0;
    windWaveActive = false; windWaveWarning = false; windWaveWarningTimer = 0; windWaveTimer = 0;
    hazards = []; bloodPacks = []; bloodPackSpawnTimer = 0; hazardSpawnTimer = 0;
    frogs = []; frogSpawnTimer = 0;
    birds = []; birdSpawnTimer = 0;
    bloodParticles = []; blinkShadows = []; featherParticles = []; smokeParticles = [];
    document.getElementById("qte-overlay").style.display = "none";
    document.getElementById("dodge-popup").style.display = "none";
    document.getElementById("game-over-screen").style.display = "none";
    isPausedForDialog = true; dialogStep = 1;
    dialogTitle.innerText = "最終任務指引";
    dialogContent.innerText = "最終任務：徹底把壽星吸乾！\n右側米色衣服為壽星，左側胖子有劇毒！\n\n新威脅注意：\n青蛙、麻雀攻擊會【大幅消耗壽星精華液】！\n善用【瞬移⚡】與【隱身術👻】保護精華！";
    dialogBtn1.innerText = "開吸！";
    dialogModal.style.display = "flex";
}

document.getElementById("retry-btn").addEventListener("click", resetGame);
document.getElementById("home-btn").addEventListener("click", () => { window.location.href = "index.html"; });

function updateSkillsUI() {
    const blinkBtn = document.getElementById("blink-btn");
    const stealthBtn = document.getElementById("stealth-btn");
    const frenzyBtn = document.getElementById("frenzy-btn");

    if (blinkCooldown <= 0) { blinkBtn.innerHTML = `<span>⚡</span><span style="font-size:10px;">瞬移</span>`; blinkBtn.style.opacity = "1"; }
    else { blinkBtn.innerHTML = `<span>${blinkCooldown.toFixed(1)}</span>`; blinkBtn.style.opacity = "0.6"; }

    if (stealthActiveTimer > 0) { stealthBtn.innerHTML = `<span>👻</span><span style="font-size:10px;">${stealthActiveTimer.toFixed(1)}s</span>`; stealthBtn.style.filter = "drop-shadow(0 0 8px #e040fb)"; }
    else if (stealthCooldown <= 0) { stealthBtn.innerHTML = `<span>👻</span><span style="font-size:10px;">隱身術</span>`; stealthBtn.style.opacity = "1"; stealthBtn.style.filter = "none"; }
    else { stealthBtn.innerHTML = `<span>${stealthCooldown.toFixed(1)}</span>`; stealthBtn.style.opacity = "0.6"; stealthBtn.style.filter = "none"; }

    if (!hasLearnedFrenzy) {
        frenzyBtn.classList.add("skill-locked");
        frenzyBtn.innerHTML = `<span>🔒</span><span style="font-size:10px;">狂吸</span>`;
    } else {
        frenzyBtn.classList.remove("skill-locked");
        if (frenzyActiveTimer > 0) { frenzyBtn.innerHTML = `<span>🌪️</span><span style="font-size:10px;">${frenzyActiveTimer.toFixed(1)}s</span>`; frenzyBtn.style.filter = "drop-shadow(0 0 10px #ff1744)"; }
        else if (frenzyCooldown <= 0) { frenzyBtn.innerHTML = `<span>🌪️</span><span style="font-size:10px;">大吸特吸</span>`; frenzyBtn.style.opacity = "1"; frenzyBtn.style.filter = "none"; }
        else { frenzyBtn.innerHTML = `<span>${frenzyCooldown.toFixed(1)}</span>`; frenzyBtn.style.opacity = "0.6"; frenzyBtn.style.filter = "none"; }
    }
}

function getCharacterAreas() {
    return [
        { category: "FAT_MAN", name: "胖子(有毒)", x: 6, y: 70, w: 690, h: 616 },
        { category: "OTHER_FRIEND", name: "中間朋友(無精華)", x: 700, y: 65, w: 152, h: 220 },
        { category: "BIRTHDAY_BOY", name: "壽星力維(精華液)", x: 960, y: 68, w: 536, h: 628 }
    ];
}

function getCurrentTarget() {
    const areas = getCharacterAreas();
    for (let a of areas) {
        if (mosquito.x >= a.x && mosquito.x <= a.x + a.w && mosquito.y >= a.y && mosquito.y <= a.y + a.h) return a;
    }
    return null;
}

const leftZone = document.getElementById("touch-left-zone");
const arenaJoy = document.getElementById("arena-joystick");
const arenaKnob = document.getElementById("arena-knob");
let joyActive = false;
let joyOrigin = { x: 0, y: 0 };
let currentTouchId = null;

function onJoyStart(clientX, clientY, touchId = null) {
    if (mosquito.isDead || isPausedForDialog) return;
    joyActive = true; currentTouchId = touchId; joyOrigin = { x: clientX, y: clientY };
    arenaJoy.style.left = clientX + "px"; arenaJoy.style.top = clientY + "px"; arenaJoy.style.display = "block";
    arenaKnob.style.transform = "translate(0px, 0px)"; joyVector = { x: 0, y: 0 };
}
function onJoyMove(clientX, clientY) {
    if (!joyActive || mosquito.isDead || isPausedForDialog) return;
    let dx = clientX - joyOrigin.x, dy = clientY - joyOrigin.y;
    const dist = Math.hypot(dx, dy), maxRadius = 55;
    if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
    arenaKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVector = { x: dx / maxRadius, y: dy / maxRadius };
}
function onJoyEnd() { joyActive = false; currentTouchId = null; arenaJoy.style.display = "none"; arenaKnob.style.transform = "translate(0px, 0px)"; joyVector = { x: 0, y: 0 }; }

function triggerBlink(e) {

        const blinkDist = 200;
        blinkShadows.push({ x: mosquito.x, y: mosquito.y, alpha: 0.8, facingRight: mosquito.facingRight });
        blinkShadows.push({ x: mosquito.x + dirX * 70, y: mosquito.y + dirY * 70, alpha: 0.5, facingRight: mosquito.facingRight });
        mosquito.x += dirX * blinkDist; mosquito.y += dirY * blinkDist; mosquito.invincibleTimer = 0.5;
        mosquito.x = Math.max(30, Math.min(worldWidth - 30, mosquito.x)); mosquito.y = Math.max(30, Math.min(worldHeight - 30, mosquito.y));

        if (windWaveActive && Math.abs(mosquito.x - windWaveX) < 160) { showDodgeEffect(); alertVal = Math.max(0, alertVal - 15); }
        if (qteActive) { qteActive = false; alertVal = 40; showDodgeEffect(); document.getElementById("qte-overlay").style.display = "none"; }
    }
}

function spawnFrog() {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 80 + 170;
    const fx = Math.max(80, Math.min(worldWidth - 120, mosquito.x + Math.cos(angle) * dist));
    const fy = Math.max(120, Math.min(worldHeight - 120, mosquito.y + Math.sin(angle) * dist));

    frogs.push({
        x: fx,
        y: fy,
        state: "AIM",
        timer: 1.3,
        w: 80,
        h: 68,
        targetX: mosquito.x,
        targetY: mosquito.y,
        actualTipX: fx + 40,
        actualTipY: fy + 25
    });
}

function spawnBird() {
    const angle = Math.random() * Math.PI * 2;
    const startX = Math.max(60, Math.min(worldWidth - 80, mosquito.x + Math.cos(angle) * 250));
    const startY = Math.max(60, Math.min(worldHeight - 100, mosquito.y + Math.sin(angle) * 250));
    const targetX = mosquito.x;
    const targetY = mosquito.y;
    const moveAngle = Math.atan2(targetY - startY, targetX - startX);
    // 麻雀飛行速度放緩至 250 (原為 440)
    const speed = 250;

    birds.push({
        x: startX,
        y: startY,
        vx: Math.cos(moveAngle) * speed,
        vy: Math.sin(moveAngle) * speed,
        facingRight: Math.cos(moveAngle) > 0,
        frameTimer: 0,
        frame: 0,
        w: 78,
        h: 70,
        warnTimer: 1.2,
        destX: targetX,
        destY: targetY,
        life: 3.2
    });
}

function spawnHazard() {
    const types = ["SWAT", "COIL"];
    const type = types[Math.floor(Math.random() * types.length)];
    if (type === "SWAT") {
        hazards.push({ type: "SWAT", x: mosquito.x + (Math.random() - 0.5) * 90, y: mosquito.y + (Math.random() - 0.5) * 90, warnTimer: 0.65, strikeTimer: 0.3, width: 90, height: 90, struck: false });
    } else if (type === "COIL") {
        hazards.push({ type: "COIL", x: Math.random() * worldWidth, y: 0, vx: (Math.random() - 0.5) * 190, vy: 150, radius: 28, angle: 0, life: 8.0 });
    }
}

function spawnBloodPack() {
    const speed = 85, angle = Math.random() * Math.PI * 2;
    bloodPacks.push({ x: Math.random() * (worldWidth - 140) + 70, y: Math.random() * (worldHeight - 200) + 100, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, w: 28, h: 28, life: 16.0, floatPhase: Math.random() * 10 });
}

let lastTime = performance.now();
let suckTick = 0;

function updateGame(dt, now) {
    if (isPausedForDialog) { render(null, now); return; }

    if (hurtFlashTimer > 0) hurtFlashTimer -= dt;
    if (essenceDrainFlashTimer > 0) essenceDrainFlashTimer -= dt;
    if (mosquito.invincibleTimer > 0) mosquito.invincibleTimer -= dt;
    if (stealthActiveTimer > 0) stealthActiveTimer -= dt;
    if (stealthCooldown > 0) stealthCooldown -= dt;
    if (frenzyStartupTimer > 0) frenzyStartupTimer -= dt;
    if (frenzyActiveTimer > 0) {
        frenzyActiveTimer -= dt;
        if (frenzyActiveTimer <= 0) {
            frenzyActiveTimer = 0;
            stopSuck();
        }
    }
    if (frenzyCooldown > 0) frenzyCooldown -= dt;
    if (blinkCooldown > 0) blinkCooldown -= dt;

    updateSkillsUI();

    if (mosquito.isDead) { deathAnimTimer += dt; soulY -= 35 * dt; updateParticles(dt); render(null, now); return; }

    if (joyVector.x !== 0 || joyVector.y !== 0) {
        mosquito.x += joyVector.x * mosquito.speed * dt;
        mosquito.y += joyVector.y * mosquito.speed * dt;
        if (joyVector.x > 0.05) mosquito.facingRight = true;
        else if (joyVector.x < -0.05) mosquito.facingRight = false;
        if (frenzyActiveTimer <= 0) stopSuck();
    }
    mosquito.x = Math.max(20, Math.min(worldWidth - 20, mosquito.x));
    mosquito.y = Math.max(20, Math.min(worldHeight - 20, mosquito.y));
    const targetCamX = mosquito.x - (canvas.width / 2) / camera.zoom, targetCamY = mosquito.y - (canvas.height / 2) / camera.zoom;
    camera.x += (targetCamX - camera.x) * 0.14; camera.y += (targetCamY - camera.y) * 0.14;
    mosquito.frameTimer += dt; if (mosquito.frameTimer > 0.09) { mosquito.frame = mosquito.frame === 0 ? 1 : 0; mosquito.frameTimer = 0; }

    hazardSpawnTimer += dt; if (hazardSpawnTimer > 3.0) { spawnHazard(); hazardSpawnTimer = 0; }
    frogSpawnTimer += dt; if (frogSpawnTimer > 7.5) { if (frogs.length < 1) spawnFrog(); frogSpawnTimer = 0; }
    birdSpawnTimer += dt; if (birdSpawnTimer > 8.0) { if (birds.length < 1) spawnBird(); birdSpawnTimer = 0; }
    bloodPackSpawnTimer += dt; if (bloodPackSpawnTimer > 5.5) { if (bloodPacks.length < 3) spawnBloodPack(); bloodPackSpawnTimer = 0; }

    for (let i = frogs.length - 1; i >= 0; i--) {
        let f = frogs[i];
        f.timer -= dt;
        const originX = f.x + 40;
        const originY = f.y + 25;
        const maxTongueReach = 80; // 舌頭長度限制在蛙身周遭 80px 內

        if (f.state === "AIM") {
            f.targetX = mosquito.x;
            f.targetY = mosquito.y;
            let dx = f.targetX - originX;
            let dy = f.targetY - originY;
            let dist = Math.hypot(dx, dy);
            if (dist > maxTongueReach && dist > 0) {
                f.actualTipX = originX + (dx / dist) * maxTongueReach;
                f.actualTipY = originY + (dy / dist) * maxTongueReach;
            } else {
                f.actualTipX = f.targetX;
                f.actualTipY = f.targetY;
            }
            if (f.timer <= 0) { f.state = "STRIKE"; f.timer = 0.5; }
        } else if (f.state === "STRIKE") {
            if (mosquito.invincibleTimer <= 0) {
                // 以縮短後的舌尖位置進行命中判定
                const distToTongue = Math.hypot(mosquito.x - f.actualTipX, mosquito.y - f.actualTipY);
                if (distToTongue < 25) {
                    essence = Math.max(0, essence - 25);
                    essenceDrainFlashTimer = 0.3;
                    showDodgeEffect("🩸 精華液被青蛙舔掉啦！-25%");
                }
            }
            if (f.timer <= 0) frogs.splice(i, 1);
        }
    }

    for (let i = birds.length - 1; i >= 0; i--) {
        let b = birds[i];
        if (b.warnTimer > 0) {
            b.warnTimer -= dt;
        } else {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.life -= dt;
            b.frameTimer += dt;
            if (b.frameTimer > 0.08) { b.frame = b.frame === 0 ? 1 : 0; b.frameTimer = 0; }

            if (Math.random() < 0.35) {
                featherParticles.push({
                    x: b.x, y: b.y,
                    vx: -b.vx * 0.15 + (Math.random() - 0.5) * 30,
                    vy: -b.vy * 0.15 + (Math.random() - 0.5) * 30,
                    alpha: 0.85
                });
            }

            if (mosquito.invincibleTimer <= 0) {
                if (Math.hypot(mosquito.x - b.x, mosquito.y - b.y) < 38) {
                    essence = Math.max(0, essence - 20);
                    essenceDrainFlashTimer = 0.3;
                    showDodgeEffect("🩸 精華液被麻雀叼走了！-20%");
                }
            }
            if (b.life <= 0) birds.splice(i, 1);
        }
    }

    for (let i = bloodPacks.length - 1; i >= 0; i--) {
        let bp = bloodPacks[i]; bp.life -= dt; bp.floatPhase += dt * 4; bp.x += bp.vx * dt; bp.y += (bp.vy + Math.sin(bp.floatPhase) * 20) * dt;
        if (bp.x < 30) { bp.x = 30; bp.vx = Math.abs(bp.vx); } if (bp.x > worldWidth - 30) { bp.x = worldWidth - 30; bp.vx = -Math.abs(bp.vx); }
        if (bp.y < 30) { bp.y = 30; bp.vy = Math.abs(bp.vy); } if (bp.y > worldHeight - 30) { bp.y = worldHeight - 30; bp.vy = -Math.abs(bp.vy); }
        if (Math.hypot(mosquito.x - bp.x, mosquito.y - bp.y) < 30) { health = Math.min(100, health + 35); for (let k = 0; k < 12; k++) bloodParticles.push({ x: bp.x, y: bp.y, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80, radius: 2.5, alpha: 1.0, color: "#76ff03" }); bloodPacks.splice(i, 1); continue; }
        if (bp.life <= 0) bloodPacks.splice(i, 1);
    }

    for (let i = hazards.length - 1; i >= 0; i--) {
        let h = hazards[i];
        if (h.type === "SWAT") {
            if (h.warnTimer > 0) { h.warnTimer -= dt; }
            else if (h.strikeTimer > 0) { h.strikeTimer -= dt; if (!h.struck && mosquito.invincibleTimer <= 0 && Math.abs(mosquito.x - h.x) < h.width / 2 && Math.abs(mosquito.y - h.y) < h.height / 2) { h.struck = true; health = Math.max(0, health - 55); hurtFlashTimer = 0.3; if (health <= 0) triggerDeath("ZAPPED"); } }
            else hazards.splice(i, 1);
        } else if (h.type === "COIL") {
            h.x += h.vx * dt; h.y += h.vy * dt; h.angle += 3.5 * dt; h.life -= dt;
            if (h.x < 30 || h.x > worldWidth - 30) h.vx *= -1; if (h.y < 30 || h.y > worldHeight - 30) h.vy *= -1;
            if (mosquito.invincibleTimer <= 0 && Math.hypot(mosquito.x - h.x, mosquito.y - h.y) < h.radius) { health = Math.max(0, health - 40 * dt); hurtFlashTimer = 0.1; if (health <= 0) triggerDeath("COIL"); }
            if (h.life <= 0) hazards.splice(i, 1);
        }
    }

    if (!isSucking) { health = Math.max(0, health - 3.5 * dt); if (health <= 0) triggerDeath("STARVED"); }
    if (!isSucking && !qteActive) alertVal = Math.max(0, alertVal - 8 * dt);

    // 掌風觸發與倒數機制：保證完整 1.8 秒預警期
    if (alertVal >= 40) {
        windWaveTimer += dt;
        if (windWaveTimer >= 1.2 && !windWaveActive) {
            windWaveWarning = true;
            windWaveWarningTimer = Math.max(0, (1.2 + WIND_WARNING_DURATION) - windWaveTimer);
        }
        if (windWaveTimer >= (1.2 + WIND_WARNING_DURATION)) {
            windWaveActive = true;
            windWaveWarning = false;
            windWaveWarningTimer = 0;
            windWaveX = mosquito.x - 340;
            windWaveTimer = 0;
        }
    } else {
        if (!windWaveActive) {
            windWaveTimer = 0;
            windWaveWarning = false;
            windWaveWarningTimer = 0;
        }
    }

    if (windWaveActive) {
        windWaveX += 780 * dt;
        if (Math.abs(mosquito.x - windWaveX) < 45) {
            if (mosquito.invincibleTimer > 0) { showDodgeEffect(); windWaveActive = false; }
            else {
                if (frenzyActiveTimer <= 0) stopSuck();
                mosquito.x += (mosquito.x - windWaveX > 0 ? 90 : -90); windWaveActive = false; health = Math.max(0, health - 25); hurtFlashTimer = 0.25; if (health <= 0) triggerDeath("WIND_STRIKE");
            }
        }
        if (windWaveX > mosquito.x + 350) windWaveActive = false;
    }

    let muscleTight = alertVal >= 70;
    if (muscleTight) screenShakeTimer += dt * 15;
    if (alertVal >= 100 && !qteActive) { qteActive = true; qteTimer = 0.75; slapHandsDist = 1.0; document.getElementById("qte-overlay").style.display = "block"; }
    if (qteActive) { qteTimer -= dt; slapHandsDist = Math.max(0, qteTimer / 0.75); if (qteTimer <= 0) triggerDeath("SLAPPED"); }

    const currentTarget = getCurrentTarget();
    const statusText = document.getElementById("status-text");

    if (isSucking) {
        suckTick += dt * 18;
        if (!currentTarget) { statusText.innerText = "❌ 咬到衣服或紙張！無法吸血"; statusText.style.color = "#bbb"; }
        else if (currentTarget.category === "BIRTHDAY_BOY") {
            const isFrenzyActive = frenzyActiveTimer > 0;
            let frenzyMul = isFrenzyActive ? 1.15 : 1.0;
            let rateMod = (muscleTight ? 0.5 : 1.0) * frenzyMul;
            let gain = 22 * rateMod;
            let alertSpd = isFrenzyActive ? 0 : 36;
            let prevEssence = essence;

            essence = Math.min(100, essence + gain * dt);
            alertVal = Math.min(100, alertVal + alertSpd * dt);
            health = Math.min(100, health + (14 * frenzyMul) * dt);

            if (prevEssence < 10 && essence >= 10 && !hasLearnedFrenzy) {
                hasLearnedFrenzy = true;
                updateSkillsUI();
                stopSuck();
                showUnlockFrenzyDialog();
            }

            if (essence >= 100 && !isStageComplete) {
                stopSuck();
                showAllCompleteDialog();
            }

            statusText.innerText = isFrenzyActive ? `🌪️ 【影分身狂吸中】匿蹤吸取壽星精華液中！` : `🩸 汲取【${currentTarget.name}】精華液中！`;
            statusText.style.color = "#ff1744";

            if (Math.random() < 0.6) _spawnBlood(mosquito.facingRight ? 11 : -11, 16, true);
        } else if (currentTarget.category === "FAT_MAN") {
            health = Math.max(0, health - 45 * dt); alertVal = 100;
            statusText.innerText = "🌀 嘔！吸到胖子油膩毒血！暴露值爆表！"; statusText.style.color = "#00e676";
            if (health <= 0) triggerDeath("POISONED");
        } else if (currentTarget.category === "OTHER_FRIEND") {
            alertVal = Math.min(100, alertVal + 26 * dt); health = Math.min(100, health + 12 * dt);
            statusText.innerText = `🩸 正在叮咬【${currentTarget.name}】(回血有效，精華無效)`; statusText.style.color = "#ff9100";
            if (Math.random() < 0.6) _spawnBlood(mosquito.facingRight ? 11 : -11, 16, true);
        }
    } else {
        if (!qteActive && hurtFlashTimer <= 0) {
            if (windWaveWarning) {
                // 頂部狀態列動態刷新倒數秒數
                statusText.innerText = `⚠️️ 掌風倒數 (${windWaveWarningTimer.toFixed(1)}s)！準備按【瞬移】或【隱身】！`;
                statusText.style.color = "#ff1744";
            } else if (currentTarget) {
                if (currentTarget.category === "BIRTHDAY_BOY") { statusText.innerText = `🟢 鎖定壽星部位：${currentTarget.name} (按住吸血)`; statusText.style.color = "#76ff03"; }
                else if (currentTarget.category === "FAT_MAN") { statusText.innerText = `⚠️ 這是大胖子！有劇毒千萬別吸！`; statusText.style.color = "#ff5252"; }
                else { statusText.innerText = `⚪ 發現中間朋友：${currentTarget.name} (可補血)`; statusText.style.color = "#fff"; }
            } else { statusText.innerText = "注意飢餓扣血！快找壽星吸血或攔截血包！"; statusText.style.color = "#ffeb3b"; }
        }
    }

    updateParticles(dt);
    document.getElementById("essence-bar").style.width = essence + "%";
    document.getElementById("health-bar").style.width = health + "%";
    document.getElementById("alert-bar").style.width = alertVal + "%";
    render(currentTarget, now);
}

function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    try {
        updateGame(dt, now);
    } catch (err) {
        console.error("迴圈保護中:", err);
    }
    requestAnimationFrame(gameLoop);
}

function updateParticles(dt) {
    for (let i = bloodParticles.length - 1; i >= 0; i--) { let p = bloodParticles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.alpha -= 2.2 * dt; if (!p.color) p.vy += 100 * dt; if (p.alpha <= 0) bloodParticles.splice(i, 1); }
    for (let i = blinkShadows.length - 1; i >= 0; i--) { blinkShadows[i].alpha -= 3.0 * dt; if (blinkShadows[i].alpha <= 0) blinkShadows.splice(i, 1); }
    for (let i = featherParticles.length - 1; i >= 0; i--) { let f = featherParticles[i]; f.x += f.vx * dt; f.y += f.vy * dt; f.alpha -= 1.8 * dt; if (f.alpha <= 0) featherParticles.splice(i, 1); }
    for (let i = smokeParticles.length - 1; i >= 0; i--) { let s = smokeParticles[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.alpha -= 2.0 * dt; if (s.alpha <= 0) smokeParticles.splice(i, 1); }
}
function _spawnBlood(offsetX, offsetY, isRed) { bloodParticles.push({ x: mosquito.x + offsetX, y: mosquito.y + offsetY, vx: (Math.random() - 0.5) * 45, vy: -Math.random() * 60 - 20, radius: Math.random() * 1.8 + 1.0, alpha: 1.0, isRed: isRed }); }

function render(currentTarget, timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    let shakeX = 0, shakeY = 0;
    if (alertVal >= 70 && !mosquito.isDead) { shakeX = Math.sin(screenShakeTimer) * 1.8; shakeY = Math.cos(screenShakeTimer) * 1.8; }
    ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x + shakeX, -camera.y + shakeY);
    drawSafe(assets.bg, 0, 0, worldWidth, worldHeight);

    for (let f of frogs) {
        ctx.save();
        if (f.state === "AIM") {
            ctx.strokeStyle = "rgba(255, 235, 59, 0.85)";
            ctx.lineWidth = 2.0;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.arc(f.actualTipX, f.actualTipY, 14 + Math.sin(performance.now() / 80) * 3, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(f.actualTipX - 16, f.actualTipY); ctx.lineTo(f.actualTipX + 16, f.actualTipY);
            ctx.moveTo(f.actualTipX, f.actualTipY - 16); ctx.lineTo(f.actualTipX, f.actualTipY + 16);
            ctx.stroke();
        }

        if (f.state === "STRIKE") {
            drawSafe(assets.frog2, f.x, f.y, f.w + 20, f.h);

            const midX = (f.x + 40 + f.actualTipX) / 2 + Math.sin(f.timer * 30) * 10;
            const midY = (f.y + 25 + f.actualTipY) / 2 + Math.cos(f.timer * 30) * 10;

            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(f.x + 40, f.y + 25);
            ctx.quadraticCurveTo(midX, midY, f.actualTipX, f.actualTipY);
            ctx.stroke();

            ctx.strokeStyle = "#ff8a80";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#76ff03";
            ctx.beginPath();
            ctx.arc(f.actualTipX, f.actualTipY, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            drawSafe(assets.frog1, f.x, f.y, f.w, f.h);
        }
        ctx.restore();
    }

    for (let b of birds) {
        ctx.save();
        if (b.warnTimer > 0) {
            ctx.strokeStyle = "rgba(255, 61, 0, 0.75)";
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.destX, b.destY);
            ctx.stroke();

            ctx.font = "bold 13px sans-serif";
            ctx.fillStyle = "#ff3d00";
            ctx.fillText("🌪️️ 麻雀俯衝！", b.x - 30, b.y - 12);
        } else {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 35, 0, Math.PI * 2);
            ctx.stroke();

            ctx.translate(b.x, b.y);
            if (!b.facingRight) ctx.scale(-1, 1);
            const currentBirdImg = b.frame === 0 ? assets.bird1 : assets.bird2;
            drawSafe(currentBirdImg, -b.w / 2, -b.h / 2, b.w, b.h);
        }
        ctx.restore();
    }

    for (let f of featherParticles) {
        ctx.save();
        ctx.fillStyle = `rgba(188, 170, 153, ${f.alpha})`;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y, 4, 8, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    for (let s of smokeParticles) {
        ctx.save();
        ctx.fillStyle = `rgba(240, 240, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    for (let bp of bloodPacks) {
        ctx.save(); ctx.translate(bp.x, bp.y);
        const wingFlap = Math.sin(bp.floatPhase * 2.5) * 6;
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)"; ctx.beginPath(); ctx.ellipse(-14, wingFlap, 9, 4, -0.3, 0, Math.PI * 2); ctx.ellipse(14, wingFlap, 9, 4, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#d50000"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(-bp.w / 2, -bp.h / 2, bp.w, bp.h, 6); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.fillRect(-3, -8, 6, 16); ctx.fillRect(-8, -3, 16, 6);
        ctx.font = "bold 10px sans-serif"; ctx.fillStyle = "#76ff03"; ctx.textAlign = "center"; ctx.fillText("+35 HP", 0, -18); ctx.restore();
    }

    for (let h of hazards) {
        ctx.save();
        if (h.type === "SWAT") {
            if (h.warnTimer > 0) { ctx.strokeStyle = "rgba(255, 23, 68, 0.85)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.strokeRect(h.x - h.width / 2, h.y - h.height / 2, h.width, h.height); ctx.font = "12px sans-serif"; ctx.fillStyle = "#ff1744"; ctx.fillText("⚡ 電蚊拍瞄準中！", h.x - 45, h.y - h.height / 2 - 6); }
            else { ctx.fillStyle = "rgba(0, 229, 255, 0.45)"; ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.fillRect(h.x - h.width / 2, h.y - h.height / 2, h.width, h.height); ctx.strokeRect(h.x - h.width / 2, h.y - h.height / 2, h.width, h.height); }
        } else if (h.type === "COIL") {
            ctx.translate(h.x, h.y); ctx.rotate(h.angle); ctx.strokeStyle = "#4e342e"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, h.radius, 0, Math.PI * 1.8); ctx.stroke(); ctx.fillStyle = "#ff3d00"; ctx.beginPath(); ctx.arc(h.radius, 0, 3.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    // 掌風警示渲染：加入相機邊界保護，確保文字絕不超出螢幕
    if (windWaveWarning) {
        ctx.save(); const curTime = timestamp || performance.now(); const pulseAlpha = 0.25 + Math.sin(curTime / 100) * 0.15;
        ctx.fillStyle = `rgba(255, 23, 68, ${pulseAlpha})`; ctx.fillRect(mosquito.x - 120, 0, 90, worldHeight);
        ctx.strokeStyle = "rgba(255, 23, 68, 0.9)"; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.moveTo(mosquito.x - 120, 0); ctx.lineTo(mosquito.x - 120, worldHeight); ctx.moveTo(mosquito.x - 30, 0); ctx.lineTo(mosquito.x - 30, worldHeight); ctx.stroke();
        ctx.setLineDash([]);

        // 計算攝影機可見視野
        const viewLeft = camera.x;
        const viewRight = camera.x + canvas.width / camera.zoom;

        const warnText = `⚠️ 掌風襲來 (${windWaveWarningTimer.toFixed(1)}s)`;
        ctx.font = "bold 12px sans-serif";
        const textWidth = ctx.measureText(warnText).width;
        const pillW = textWidth + 18;
        const pillH = 22;

        let pillX = mosquito.x;
        const halfW = pillW / 2;
        if (pillX - halfW < viewLeft + 8) pillX = viewLeft + 8 + halfW;
        if (pillX + halfW > viewRight - 8) pillX = viewRight - 8 - halfW;
        const pillY = mosquito.y - 32;

        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(pillX - halfW, pillY - 14, pillW, pillH, 8);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffeb3b";
        ctx.fillText(warnText, pillX, pillY - 3);

        ctx.restore();
    }

    if (windWaveActive) { ctx.save(); ctx.fillStyle = "rgba(255, 255, 255, 0.25)"; ctx.fillRect(windWaveX - 25, 0, 50, worldHeight); ctx.fillStyle = "rgba(255, 255, 255, 0.65)"; ctx.fillRect(windWaveX - 6, 0, 12, worldHeight); ctx.restore(); }

    for (let s of blinkShadows) { ctx.save(); ctx.translate(s.x, s.y); if (s.facingRight) ctx.scale(1, 1); else ctx.scale(-1, 1); ctx.globalAlpha = s.alpha * 0.6; drawSafe(assets.fly1, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size); ctx.restore(); }
    for (let p of bloodParticles) { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = p.color ? p.color : `rgba(220, 20, 60, ${p.alpha})`; ctx.fill(); }

    ctx.save();
    ctx.translate(mosquito.x, mosquito.y);
    const curTime = timestamp || performance.now();

    if (stealthActiveTimer > 0) {
        ctx.globalAlpha = 0.45;
        ctx.shadowColor = "#e040fb";
        ctx.shadowBlur = 15;
    } else if (mosquito.invincibleTimer > 0 && Math.floor(curTime / 40) % 2 === 0) {
        ctx.globalAlpha = 0.4;
    }

    if (mosquito.isDead) {
        if (mosquito.deathType === "SLAPPED") {
            ctx.scale(1.8, 0.3); drawSafe(assets.dizzy, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
            ctx.save(); ctx.scale(1 / 1.8, 1 / 0.3); ctx.fillStyle = "rgba(255, 255, 255, 0.65)"; ctx.beginPath(); ctx.arc(0, soulY - 20, 10, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "gold"; ctx.lineWidth = 1.5; ctx.strokeRect(-6, soulY - 35, 12, 3); ctx.restore();
        } else { ctx.rotate(Math.PI); drawSafe(assets.dizzy, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size); }
    } else {
        if (mosquito.facingRight) ctx.scale(1, 1); else ctx.scale(-1, 1);

        if (frenzyStartupTimer > 0) {
            let startupImg = frenzyStartupTimer > 0.15 ? 
                (isImgReady(assets.shadow1) ? assets.shadow1 : (isImgReady(assets.shadow1_alt) ? assets.shadow1_alt : null)) :
                (isImgReady(assets.shadow2) ? assets.shadow2 : (isImgReady(assets.shadow2_alt) ? assets.shadow2_alt : null));
            let drawImg = startupImg || (isImgReady(assets.suck) ? assets.suck : assets.fly1);
            drawSafe(drawImg, -mosquito.size / 2 - 4, -mosquito.size / 2 - 8, mosquito.size + 8, mosquito.size + 8);
        } 
        else if (frenzyActiveTimer > 0) {
            ctx.shadowColor = "#ff1744";
            ctx.shadowBlur = 12;
            let suckImg = isImgReady(assets.suck) ? assets.suck : assets.fly1;

            ctx.save();
            ctx.translate(-26, Math.sin(suckTick * 2.0) * 1.5);
            drawSafe(suckImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
            ctx.restore();

            ctx.save();
            ctx.translate(26, Math.cos(suckTick * 2.0) * 1.5);
            drawSafe(suckImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
            ctx.restore();

            ctx.save();
            ctx.translate(0, Math.sin(suckTick * 2.2) * 1.0);
            drawSafe(suckImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
            ctx.restore();

            ctx.shadowBlur = 0;
        } 
        else {
            let currentImg = assets.fly1;
            if (isSucking && currentTarget) {
                if (currentTarget.category === "FAT_MAN") { currentImg = isImgReady(assets.dizzy) ? assets.dizzy : assets.fly1; ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3); }
                else { currentImg = isImgReady(assets.suck) ? assets.suck : assets.fly1; ctx.translate(0, Math.sin(suckTick * 2.0) * 0.8); }
            } else {
                currentImg = mosquito.frame === 0 ? assets.fly1 : assets.fly2;
            }
            drawSafe(currentImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
        }
    }
    ctx.restore();

    if (qteActive && !mosquito.isDead) {
        ctx.save(); const offset = slapHandsDist * 160; ctx.fillStyle = "rgba(20, 20, 20, 0.75)";
        ctx.beginPath(); ctx.ellipse(mosquito.x - offset - 40, mosquito.y, 45, 60, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(mosquito.x + offset + 40, mosquito.y, 45, 60, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
    ctx.restore();

    if (hurtFlashTimer > 0) { ctx.save(); ctx.fillStyle = `rgba(255, 0, 0, ${hurtFlashTimer * 1.5})`; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore(); }
    if (essenceDrainFlashTimer > 0) { ctx.save(); ctx.fillStyle = `rgba(224, 64, 251, ${essenceDrainFlashTimer * 1.2})`; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore(); }
}
</script>
