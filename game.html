<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>忍者蚊子 - 幫力維吸出來</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 頂部 HUD */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            left: 20px;
            width: 280px;
            max-width: 65vw;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 30;
        }
        #status-text {
            font-size: 15px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 6px;
            white-space: nowrap;
        }
        .bar-container {
            margin-bottom: 4px;
        }
        .bar-label {
            font-size: 11px;
            margin-bottom: 2px;
            color: #ddd;
        }
        .progress-bg {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            overflow: hidden;
        }
        #essence-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff1744, #ff5252);
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #43a047, #76ff03);
            transition: width 0.08s ease-out;
        }
        #alert-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9100, #d50000);
            transition: width 0.08s linear;
        }

        #debug-btn {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            right: 20px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            color: #fff;
            font-size: 12px;
            z-index: 35;
            cursor: pointer;
        }

        /* 劇情/教學/勝利對話框 */
        #dialog-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86%;
            max-width: 380px;
            background: rgba(18, 18, 28, 0.96);
            border: 2px solid #ffd54f;
            border-radius: 18px;
            padding: 22px 20px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 90;
            box-shadow: 0 0 25px rgba(255, 213, 79, 0.4);
            backdrop-filter: blur(10px);
        }
        #dialog-title {
            color: #ffd54f;
            font-size: 19px;
            font-weight: 900;
            margin-bottom: 12px;
            text-align: center;
        }
        #dialog-content {
            font-size: 15px;
            line-height: 1.6;
            color: #eee;
            margin-bottom: 18px;
            text-align: center;
            white-space: pre-line;
        }
        .dialog-btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }
        .dialog-action-btn {
            padding: 10px 28px;
            background: linear-gradient(135deg, #ffb300, #ff6f00);
            border: none;
            border-radius: 22px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 179, 0, 0.6);
        }
        .dialog-action-btn.secondary {
            background: rgba(60, 60, 75, 0.9);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        #qte-overlay {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff1744;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 0 10px #000, 0 0 20px #ff1744;
            display: none;
            z-index: 45;
            pointer-events: none;
            animation: pulse 0.15s infinite alternate;
            text-align: center;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1.0); }
            100% { transform: translate(-50%, -50%) scale(1.15); }
        }

        #dodge-popup {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            color: #00e5ff;
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            text-shadow: 0 0 10px #000, 0 0 20px #00e5ff;
            display: none;
            z-index: 48;
            pointer-events: none;
            transition: transform 0.2s ease-out, opacity 0.3s ease-out;
        }

        /* 左側搖桿區 */
        #touch-left-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 55vw;
            height: 100vh;
            z-index: 10;
            touch-action: none;
        }
        #arena-joystick {
            position: absolute;
            width: 140px;
            height: 140px;
            margin-left: -70px;
            margin-top: -70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.45) 80%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: none;
            z-index: 15;
        }
        #arena-knob {
            position: absolute;
            width: 56px;
            height: 56px;
            top: 42px;
            left: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(200, 200, 200, 0.6) 100%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        /* 傳說對決風格 右側技能盤盤面 */
        #arena-action-pad {
            position: absolute;
            right: 15px;
            bottom: 20px;
            width: 220px;
            height: 220px;
            z-index: 25;
            touch-action: none;
            pointer-events: none;
        }
        #suck-btn {
            position: absolute;
            right: 15px;
            bottom: 15px;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229, 57, 53, 0.9) 0%, rgba(183, 28, 28, 0.95) 100%);
            border: 3px solid rgba(255, 138, 128, 0.85);
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.7);
            color: #fff;
            font-size: 17px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.08s ease;
        }
        #suck-btn:active, #suck-btn.pressed {
            transform: scale(0.92);
            background: radial-gradient(circle, rgba(255, 23, 68, 1) 0%, rgba(213, 0, 0, 1) 100%);
        }
        .skill-btn {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            transition: transform 0.08s ease, filter 0.2s ease;
        }
        .skill-btn:active {
            transform: scale(0.9);
        }
        #blink-btn {
            right: 110px;
            bottom: 30px;
            background: radial-gradient(circle, rgba(0, 176, 255, 0.85) 0%, rgba(0, 145, 234, 0.95) 100%);
            border: 2px solid rgba(128, 222, 234, 0.9);
            box-shadow: 0 0 14px rgba(0, 176, 255, 0.6);
        }
        #skill-slot2 {
            right: 105px;
            bottom: 105px;
            background: radial-gradient(circle, rgba(66, 66, 66, 0.8) 0%, rgba(33, 33, 33, 0.9) 100%);
            border: 2px solid rgba(255, 255, 255, 0.35);
        }
        #skill-slot3 {
            right: 30px;
            bottom: 115px;
            background: radial-gradient(circle, rgba(66, 66, 66, 0.8) 0%, rgba(33, 33, 33, 0.9) 100%);
            border: 2px solid rgba(255, 255, 255, 0.35);
        }
        .skill-locked {
            filter: grayscale(1);
            opacity: 0.55 !important;
            cursor: not-allowed;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 95;
            color: #fff;
            backdrop-filter: blur(5px);
        }
        #death-title {
            font-size: 38px;
            font-weight: 900;
            color: #ff1744;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 23, 68, 0.8);
        }
        #death-reason {
            font-size: 16px;
            color: #eee;
            margin-bottom: 25px;
            max-width: 80%;
            text-align: center;
            line-height: 1.5;
        }
        .game-over-btn-group {
            display: flex;
            gap: 15px;
        }
        .over-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border-radius: 28px;
            cursor: pointer;
            transition: transform 0.1s ease;
            text-align: center;
        }
        #retry-btn {
            background: linear-gradient(135deg, #d50000, #ff5252);
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 82, 82, 0.6);
        }
        #home-btn {
            background: rgba(40, 40, 50, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 劇情/教學/勝利對話彈窗 -->
    <div id="dialog-modal">
        <div id="dialog-title">任務指引</div>
        <div id="dialog-content">任務內容: 幫力維吸出來，請將壽星精華液吸滿</div>
        <div id="dialog-btns" class="dialog-btn-group">
            <button id="dialog-btn-1" class="dialog-action-btn">確定</button>
            <button id="dialog-btn-2" class="dialog-action-btn secondary" style="display:none;">不要</button>
        </div>
    </div>

    <div id="touch-left-zone"></div>
    <div id="arena-joystick">
        <div id="arena-knob"></div>
    </div>

    <div id="debug-btn">👁 顯示熱區</div>
    <div id="qte-overlay">⚠️ 巨掌合圍！按【瞬移⚡】閃避！</div>
    <div id="dodge-popup">⚡ DODGE! 完美閃避！</div>

    <div id="hud">
        <div id="status-text">目標：探索合照尋找壽星</div>
        <div class="bar-container">
            <div class="bar-label">壽星精華液</div>
            <div class="progress-bg"><div id="essence-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">蚊子生命值 (未吸血持續扣減)</div>
            <div class="progress-bg"><div id="health-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">暴露值</div>
            <div class="progress-bg"><div id="alert-bar"></div></div>
        </div>
    </div>

    <!-- 傳說對決風格右側面板 -->
    <div id="arena-action-pad">
        <div id="suck-btn">
            <span>💉</span>
            <span style="font-size:12px;">吸血</span>
        </div>
        <div id="blink-btn" class="skill-btn skill-locked">
            <span>🔒</span>
            <span style="font-size:10px;">瞬移</span>
        </div>
        <div id="skill-slot2" class="skill-btn skill-locked">
            <span>🔒</span>
            <span style="font-size:10px;">技能2</span>
        </div>
        <div id="skill-slot3" class="skill-btn skill-locked">
            <span>🔒</span>
            <span style="font-size:10px;">技能3</span>
        </div>
    </div>

    <div id="game-over-screen">
        <div id="death-title">啪！忍道終結</div>
        <div id="death-reason">壽星神掌從天而降，你被拍成了肉餅...</div>
        <div class="game-over-btn-group">
            <div id="retry-btn" class="over-btn">再試一次</div>
            <div id="home-btn" class="over-btn">回首頁</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const assets = {
    bg: new Image(),
    fly1: new Image(),
    fly2: new Image(),
    suck: new Image(),
    dizzy: new Image()
};
assets.bg.src = "bg_level1.png";
assets.fly1.src = "mosquito_fly_1.png";
assets.fly2.src = "mosquito_fly_2.png";
assets.suck.src = "mosquito_suck.png";
assets.dizzy.src = "mosquito_dizzy.png";

let worldWidth = 740;
let worldHeight = 842;

assets.bg.onload = function() {
    worldWidth = assets.bg.naturalWidth || 740;
    worldHeight = assets.bg.naturalHeight || 842;
    resetGame();
};

const camera = { x: 0, y: 0, zoom: 3.8 };

const mosquito = {
    x: 450,
    y: 230,
    size: 32,
    speed: 260,
    facingRight: true,
    frame: 0,
    frameTimer: 0,
    isDead: false,
    deathType: "",
    invincibleTimer: 0
};

let essence = 0;
let health = 100;
let alertVal = 0;

let isSucking = false;
let blinkCooldown = 0;
let hasLearnedBlink = false;
let hasPromptedAlert10 = false;
let isStageComplete = false;
let joyVector = { x: 0, y: 0 };

let bloodParticles = [];
let blinkShadows = [];
let showDebugBoxes = false;

let hazards = [];
let hazardSpawnTimer = 0;

let bloodPacks = [];
let bloodPackSpawnTimer = 0;

// 掌風機制：大幅加長前搖時間
let windWaveTimer = 0;
let windWaveActive = false;
let windWaveX = -200;
let windWaveWarning = false;
let windWaveWarningTimer = 0; // 前搖倒數計時
let screenShakeTimer = 0;
let hurtFlashTimer = 0;
let qteActive = false;
let qteTimer = 0;
let slapHandsDist = 1.0;
let deathAnimTimer = 0;
let soulY = 0;

// 對話流程狀態控制
let isPausedForDialog = true;
let dialogStep = 1;
const dialogModal = document.getElementById("dialog-modal");
const dialogTitle = document.getElementById("dialog-title");
const dialogContent = document.getElementById("dialog-content");
const dialogBtn1 = document.getElementById("dialog-btn-1");
const dialogBtn2 = document.getElementById("dialog-btn-2");

function handleBtn1Click(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (dialogStep === 1) {
        dialogStep = 2;
        dialogTitle.innerText = "重要警告";
        dialogContent.innerText = "警告: 胖子的血有毒，不要吸，會死！";
    } else if (dialogStep === 2) {
        dialogStep = 3;
        dialogTitle.innerText = "生存提示";
        dialogContent.innerText = "什麼事都不做也會減少生命值，快去吸吧！";
    } else if (dialogStep === 3) {
        dialogStep = 4;
        dialogModal.style.display = "none";
        isPausedForDialog = false;
    } else if (dialogStep === "UNLOCK_BLINK" || dialogStep === "ALERT_10") {
        dialogModal.style.display = "none";
        isPausedForDialog = false;
    } else if (dialogStep === "WIN_CHOICE") {
        dialogStep = "FINAL_RESPONSE";
        dialogTitle.innerText = "🎉 戰鬥意志燃燒！";
        dialogContent.innerText = "來吧，一起幫力維吸出來！";
        dialogBtn1.innerText = "再戰一次";
        dialogBtn2.style.display = "inline-block";
        dialogBtn2.innerText = "回首頁";
    } else if (dialogStep === "FINAL_RESPONSE") {
        resetGame();
    }
}

function handleBtn2Click(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (dialogStep === "WIN_CHOICE") {
        dialogStep = "FINAL_RESPONSE";
        dialogTitle.innerText = "😏 無法拒絕！";
        dialogContent.innerText = "不要就是要，來吧，一起幫力維吸出來！";
        dialogBtn1.innerText = "再戰一次";
        dialogBtn2.style.display = "inline-block";
        dialogBtn2.innerText = "回首頁";
    } else if (dialogStep === "FINAL_RESPONSE") {
        window.location.href = "index.html";
    }
}

dialogBtn1.addEventListener("click", handleBtn1Click);
dialogBtn1.addEventListener("touchend", handleBtn1Click);
dialogBtn2.addEventListener("click", handleBtn2Click);
dialogBtn2.addEventListener("touchend", handleBtn2Click);

function showUnlockBlinkDialog() {
    isPausedForDialog = true;
    dialogStep = "UNLOCK_BLINK";
    dialogTitle.innerText = "🎉 領悟新忍術！";
    dialogContent.innerText = "恭喜壽星精華液達到 10%！\n你已學會【瞬移⚡】忍術！推動左搖桿並按下瞬移，可高速穿透閃避危險與掌風！";
    dialogBtn1.innerText = "確定";
    dialogBtn2.style.display = "none";
    dialogModal.style.display = "flex";
}

function showAlert10Dialog() {
    isPausedForDialog = true;
    dialogStep = "ALERT_10";
    dialogTitle.innerText = "⚠️ 警報注意！";
    dialogContent.innerText = "吸血時，暴露值會提高，將面臨攻擊！";
    dialogBtn1.innerText = "知道了";
    dialogBtn2.style.display = "none";
    dialogModal.style.display = "flex";
}

function showWinDialog() {
    isPausedForDialog = true;
    isStageComplete = true;
    dialogStep = "WIN_CHOICE";
    dialogTitle.innerText = "🏆 任務達成！";
    dialogContent.innerText = "第一階段任務完成，你開始懂得如何吸了，接下來要不要把壽星完全吸乾？";
    dialogBtn1.innerText = "要";
    dialogBtn2.innerText = "不要";
    dialogBtn2.style.display = "inline-block";
    dialogModal.style.display = "flex";
}

document.getElementById("debug-btn").addEventListener("click", () => {
    showDebugBoxes = !showDebugBoxes;
    document.getElementById("debug-btn").innerText = showDebugBoxes ? "關閉熱區" : "👁 顯示熱區";
});

function resetGame() {
    mosquito.x = 450;
    mosquito.y = 230;
    mosquito.isDead = false;
    mosquito.deathType = "";
    mosquito.invincibleTimer = 0;
    essence = 0;
    health = 100;
    alertVal = 0;
    isSucking = false;
    blinkCooldown = 0;
    hasLearnedBlink = false;
    hasPromptedAlert10 = false;
    isStageComplete = false;
    updateBlinkBtnUI();
    qteActive = false;
    qteTimer = 0;
    slapHandsDist = 1.0;
    deathAnimTimer = 0;
    soulY = 0;
    hurtFlashTimer = 0;
    windWaveActive = false;
    windWaveWarning = false;
    windWaveWarningTimer = 0;
    hazards = [];
    bloodPacks = [];
    bloodPackSpawnTimer = 0;
    hazardSpawnTimer = 0;
    bloodParticles = [];
    blinkShadows = [];
    document.getElementById("qte-overlay").style.display = "none";
    document.getElementById("dodge-popup").style.display = "none";
    document.getElementById("game-over-screen").style.display = "none";

    isPausedForDialog = true;
    dialogStep = 1;
    dialogTitle.innerText = "任務指引";
    dialogContent.innerText = "任務內容: 幫力維吸出來，請將壽星精華液吸滿";
    dialogBtn1.innerText = "確定";
    dialogBtn2.style.display = "none";
    dialogModal.style.display = "flex";
}

document.getElementById("retry-btn").addEventListener("click", resetGame);
document.getElementById("home-btn").addEventListener("click", () => {
    window.location.href = "index.html";
});

function updateBlinkBtnUI() {
    const blinkBtn = document.getElementById("blink-btn");
    if (!hasLearnedBlink) {
        blinkBtn.classList.add("skill-locked");
        blinkBtn.innerHTML = `<span>🔒</span><span style="font-size:10px;">未解鎖</span>`;
    } else {
        blinkBtn.classList.remove("skill-locked");
        if (blinkCooldown <= 0) {
            blinkBtn.innerHTML = `<span>⚡</span><span style="font-size:10px;">瞬移</span>`;
            blinkBtn.style.opacity = "1";
        } else {
            blinkBtn.innerHTML = `<span>${blinkCooldown.toFixed(1)}</span>`;
            blinkBtn.style.opacity = "0.6";
        }
    }
}

function getCharacterAreas() {
    return [
        { category: "BIRTHDAY_BOY", name: "壽星臉部", x: 385, y: 30, w: 130, h: 160 },
        { category: "BIRTHDAY_BOY", name: "壽星雙手手臂", x: 340, y: 175, w: 235, h: 210 },
        { category: "BIRTHDAY_BOY", name: "壽星左腿與拖鞋", x: 355, y: 540, w: 95, h: 235 },
        { category: "BIRTHDAY_BOY", name: "壽星右腿與拖鞋", x: 450, y: 540, w: 110, h: 235 },
        { category: "FAT_MAN", name: "胖子臉部", x: 250, y: 35, w: 105, h: 140 },
        { category: "FAT_MAN", name: "胖子小腿", x: 275, y: 530, w: 80, h: 160 },
        { category: "OTHER_FRIEND", name: "白衣朋友臉部", x: 110, y: 25, w: 110, h: 145 },
        { category: "OTHER_FRIEND", name: "白衣朋友手臂比讚", x: 25, y: 175, w: 115, h: 115 },
        { category: "OTHER_FRIEND", name: "白衣朋友小腿", x: 155, y: 520, w: 105, h: 210 },

        { category: "OTHER_FRIEND", name: "灰衣朋友露腳踝", x: 620, y: 690, w: 90, h: 140 }
    ];
}

function getCurrentTarget() {
    const areas = getCharacterAreas();
    for (let a of areas) {
        if (mosquito.x >= a.x && mosquito.x <= a.x + a.w &&
            mosquito.y >= a.y && mosquito.y <= a.y + a.h) {
            return a;
        }
    }
    return null;
}

const leftZone = document.getElementById("touch-left-zone");
const arenaJoy = document.getElementById("arena-joystick");
const arenaKnob = document.getElementById("arena-knob");
let joyActive = false;
let joyOrigin = { x: 0, y: 0 };
let currentTouchId = null;

function onJoyStart(clientX, clientY, touchId = null) {
    if (mosquito.isDead || isPausedForDialog) return;
    joyActive = true;
    currentTouchId = touchId;
    joyOrigin = { x: clientX, y: clientY };
    arenaJoy.style.left = clientX + "px";
    arenaJoy.style.top = clientY + "px";
    arenaJoy.style.display = "block";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

function onJoyMove(clientX, clientY) {
    if (!joyActive || mosquito.isDead || isPausedForDialog) return;
    let dx = clientX - joyOrigin.x;
    let dy = clientY - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    const maxRadius = 55;
    if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
    }
    arenaKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVector = { x: dx / maxRadius, y: dy / maxRadius };
}

function onJoyEnd() {
    joyActive = false;
    currentTouchId = null;
    arenaJoy.style.display = "none";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

leftZone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (joyActive || mosquito.isDead || isPausedForDialog) return;
    const t = e.changedTouches[0];
    onJoyStart(t.clientX, t.clientY, t.identifier);
}, { passive: false });

window.addEventListener("touchmove", (e) => {
    if (!joyActive || mosquito.isDead || isPausedForDialog) return;
    for (let t of e.touches) {
        if (t.identifier === currentTouchId) {
            onJoyMove(t.clientX, t.clientY);
            break;
        }
    }
});

window.addEventListener("touchend", (e) => {
    if (!joyActive) return;
    for (let t of e.changedTouches) {
        if (t.identifier === currentTouchId) {
            onJoyEnd();
            break;
        }
    }
});

leftZone.addEventListener("mousedown", (e) => onJoyStart(e.clientX, e.clientY));
window.addEventListener("mousemove", (e) => { if (joyActive && currentTouchId === null) onJoyMove(e.clientX, e.clientY); });
window.addEventListener("mouseup", (e) => { if (joyActive && currentTouchId === null) onJoyEnd(); });

const suckBtn = document.getElementById("suck-btn");
const blinkBtn = document.getElementById("blink-btn");

function startSuck() {
    if (mosquito.isDead || isPausedForDialog) return;
    isSucking = true;
    suckBtn.classList.add("pressed");
}
function stopSuck() {
    isSucking = false;
    suckBtn.classList.remove("pressed");
}

suckBtn.addEventListener("mousedown", startSuck);
window.addEventListener("mouseup", stopSuck);
suckBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startSuck(); }, { passive: false });
window.addEventListener("touchend", stopSuck);

function showDodgeEffect() {
    const popup = document.getElementById("dodge-popup");
    popup.style.display = "block";
    popup.style.transform = "translate(-50%, -50%) scale(1.2)";
    popup.style.opacity = "1";
    setTimeout(() => {
        popup.style.transform = "translate(-50%, -70%) scale(0.9)";
        popup.style.opacity = "0";
        setTimeout(() => { popup.style.display = "none"; }, 300);
    }, 500);
}

function triggerBlink(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (!hasLearnedBlink) return;
    if (blinkCooldown <= 0 && !mosquito.isDead && !isPausedForDialog) {
        blinkCooldown = 2.0;
        stopSuck();

        let dirX = joyVector.x;
        let dirY = joyVector.y;
        const mag = Math.hypot(dirX, dirY);

        if (mag > 0.1) {
            dirX /= mag;
            dirY /= mag;
        } else {
            dirX = mosquito.facingRight ? 1 : -1;
            dirY = 0;
        }

        const blinkDist = 180;
        blinkShadows.push({ x: mosquito.x, y: mosquito.y, alpha: 0.8, facingRight: mosquito.facingRight });
        blinkShadows.push({ x: mosquito.x + dirX * 60, y: mosquito.y + dirY * 60, alpha: 0.5, facingRight: mosquito.facingRight });

        mosquito.x += dirX * blinkDist;
        mosquito.y += dirY * blinkDist;
        mosquito.invincibleTimer = 0.5;

        mosquito.x = Math.max(25, Math.min(worldWidth - 25, mosquito.x));
        mosquito.y = Math.max(25, Math.min(worldHeight - 25, mosquito.y));

        for (let i = 0; i < 16; i++) {
            bloodParticles.push({
                x: mosquito.x + (Math.random() - 0.5) * 30,
                y: mosquito.y + (Math.random() - 0.5) * 30,
                vx: (Math.random() - 0.5) * 160,
                vy: (Math.random() - 0.5) * 160,
                radius: Math.random() * 3 + 2,
                alpha: 1.0,
                color: "#00e5ff"
            });
        }

        if (windWaveActive && Math.abs(mosquito.x - windWaveX) < 160) {
            showDodgeEffect();
            alertVal = Math.max(0, alertVal - 15);
        }

        if (qteActive) {
            qteActive = false;
            alertVal = 40;
            showDodgeEffect();
            document.getElementById("qte-overlay").style.display = "none";
        }
    }
}

blinkBtn.addEventListener("click", triggerBlink);
blinkBtn.addEventListener("touchstart", triggerBlink, { passive: false });

function triggerDeath(reason) {
    if (mosquito.isDead) return;
    mosquito.isDead = true;
    mosquito.deathType = reason;
    stopSuck();
    document.getElementById("qte-overlay").style.display = "none";

    const reasonText = document.getElementById("death-reason");
    if (reason === "STARVED") {
        reasonText.innerText = "長時間未吸血，體力耗盡飢餓墜地身亡...";
    } else if (reason === "SLAPPED") {
        reasonText.innerText = "壽星四人合體神掌合攏！你被拍扁貼在皮膚上，精華液全濺光了...";
        for (let i = 0; i < 45; i++) {
            bloodParticles.push({
                x: mosquito.x, y: mosquito.y,
                vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180,
                radius: Math.random() * 4 + 2, alpha: 1.0, isRed: true
            });
        }
    } else if (reason === "ZAPPED") {
        reasonText.innerText = "啪滋！被高壓電蚊拍正面擊中，當場碳化化為灰燼！";
    } else if (reason === "SPRAY") {
        reasonText.innerText = "吸入過量殺蟲劑毒氣，神經麻痺窒息死亡...";
    } else if (reason === "COIL") {
        reasonText.innerText = "被旋轉燃燒的蚊香燙傷烤焦，忍道終結...";
    } else if (reason === "WIND_STRIKE") {
        reasonText.innerText = "強烈掌風正面命中！脆弱的翅膀與身軀當場碎裂墜地...";
    } else {
        reasonText.innerText = "嘔！吸到太多胖子油膩毒血，蚊子當場暴斃身亡...";
    }

    setTimeout(() => {
        document.getElementById("game-over-screen").style.display = "flex";
    }, 1800);
}

function spawnHazard() {
    const types = ["SPRAY", "SWAT", "COIL"];
    const type = types[Math.floor(Math.random() * types.length)];

    if (type === "SPRAY") {
        const fromLeft = Math.random() < 0.5;
        hazards.push({
            type: "SPRAY",
            x: fromLeft ? 0 : worldWidth,
            y: mosquito.y + (Math.random() - 0.5) * 200,
            vx: fromLeft ? 110 : -110,
            radius: 52,
            life: 6.0
        });
    } else if (type === "SWAT") {
        hazards.push({
            type: "SWAT",
            x: mosquito.x + (Math.random() - 0.5) * 100,
            y: mosquito.y + (Math.random() - 0.5) * 100,
            warnTimer: 0.8,
            strikeTimer: 0.35,
            width: 80,
            height: 80,
            struck: false
        });
    } else if (type === "COIL") {
        hazards.push({
            type: "COIL",
            x: Math.random() * worldWidth,
            y: 0,
            vx: (Math.random() - 0.5) * 140,
            vy: 120,
            radius: 26,
            angle: 0,
            life: 8.0
        });
    }
}

function spawnBloodPack() {
    const speed = 70;
    const angle = Math.random() * Math.PI * 2;
    bloodPacks.push({
        x: Math.random() * (worldWidth - 140) + 70,
        y: Math.random() * (worldHeight - 200) + 100,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        w: 26,
        h: 26,
        life: 16.0,
        floatPhase: Math.random() * 10
    });
}

let lastTime = performance.now();
let suckTick = 0;

function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (isPausedForDialog) {
        render(null, now);
        requestAnimationFrame(gameLoop);
        return;
    }

    if (hurtFlashTimer > 0) hurtFlashTimer -= dt;
    if (mosquito.invincibleTimer > 0) mosquito.invincibleTimer -= dt;

    if (mosquito.isDead) {
        deathAnimTimer += dt;
        soulY -= 35 * dt;
        updateParticles(dt);
        render(null, now);
        requestAnimationFrame(gameLoop);
        return;
    }

    if (blinkCooldown > 0) {
        blinkCooldown -= dt;
        if (blinkCooldown <= 0) blinkCooldown = 0;
        updateBlinkBtnUI();
    }

    if (joyVector.x !== 0 || joyVector.y !== 0) {
        mosquito.x += joyVector.x * mosquito.speed * dt;
        mosquito.y += joyVector.y * mosquito.speed * dt;
        if (joyVector.x > 0.05) mosquito.facingRight = true;
        else if (joyVector.x < -0.05) mosquito.facingRight = false;
        stopSuck();
    }

    mosquito.x = Math.max(20, Math.min(worldWidth - 20, mosquito.x));
    mosquito.y = Math.max(20, Math.min(worldHeight - 20, mosquito.y));

    const targetCamX = mosquito.x - (canvas.width / 2) / camera.zoom;
    const targetCamY = mosquito.y - (canvas.height / 2) / camera.zoom;
    camera.x += (targetCamX - camera.x) * 0.14;
    camera.y += (targetCamY - camera.y) * 0.14;

    mosquito.frameTimer += dt;
    if (mosquito.frameTimer > 0.09) {
        mosquito.frame = mosquito.frame === 0 ? 1 : 0;
        mosquito.frameTimer = 0;
    }

    hazardSpawnTimer += dt;
    if (hazardSpawnTimer > 2.5) {
        spawnHazard();
        hazardSpawnTimer = 0;
    }

    bloodPackSpawnTimer += dt;
    if (bloodPackSpawnTimer > 6.0) {
        if (bloodPacks.length < 3) spawnBloodPack();
        bloodPackSpawnTimer = 0;
    }

    for (let i = bloodPacks.length - 1; i >= 0; i--) {
        let bp = bloodPacks[i];
        bp.life -= dt;
        bp.floatPhase += dt * 4;

        bp.x += bp.vx * dt;
        bp.y += (bp.vy + Math.sin(bp.floatPhase) * 20) * dt;

        if (bp.x < 30) { bp.x = 30; bp.vx = Math.abs(bp.vx); }
        if (bp.x > worldWidth - 30) { bp.x = worldWidth - 30; bp.vx = -Math.abs(bp.vx); }
        if (bp.y < 30) { bp.y = 30; bp.vy = Math.abs(bp.vy); }
        if (bp.y > worldHeight - 30) { bp.y = worldHeight - 30; bp.vy = -Math.abs(bp.vy); }

        const dist = Math.hypot(mosquito.x - bp.x, mosquito.y - bp.y);
        if (dist < 28) {
            health = Math.min(100, health + 35);
            for (let k = 0; k < 12; k++) {
                bloodParticles.push({
                    x: bp.x, y: bp.y,
                    vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80,
                    radius: 2.5, alpha: 1.0, color: "#76ff03"
                });
            }
            bloodPacks.splice(i, 1);
            continue;
        }
        if (bp.life <= 0) bloodPacks.splice(i, 1);
    }

    for (let i = hazards.length - 1; i >= 0; i--) {
        let h = hazards[i];
        if (h.type === "SPRAY") {
            h.x += h.vx * dt;
            h.life -= dt;
            if (mosquito.invincibleTimer <= 0) {
                const dist = Math.hypot(mosquito.x - h.x, mosquito.y - h.y);
                if (dist < h.radius) {
                    health = Math.max(0, health - 28 * dt);
                    hurtFlashTimer = 0.1;
                    if (health <= 0) triggerDeath("SPRAY");
                }
            }
            if (h.life <= 0) hazards.splice(i, 1);
        } else if (h.type === "SWAT") {
            if (h.warnTimer > 0) {
                h.warnTimer -= dt;
            } else if (h.strikeTimer > 0) {
                h.strikeTimer -= dt;
                if (!h.struck && mosquito.invincibleTimer <= 0) {
                    if (Math.abs(mosquito.x - h.x) < h.width / 2 && Math.abs(mosquito.y - h.y) < h.height / 2) {
                        h.struck = true;
                        health = Math.max(0, health - 50);
                        hurtFlashTimer = 0.3;
                        if (health <= 0) triggerDeath("ZAPPED");
                    }
                }
            } else {
                hazards.splice(i, 1);
            }
        } else if (h.type === "COIL") {
            h.x += h.vx * dt;
            h.y += h.vy * dt;
            h.angle += 3 * dt;
            h.life -= dt;
            if (h.x < 30 || h.x > worldWidth - 30) h.vx *= -1;
            if (h.y < 30 || h.y > worldHeight - 30) h.vy *= -1;

            if (mosquito.invincibleTimer <= 0) {
                const dist = Math.hypot(mosquito.x - h.x, mosquito.y - h.y);
                if (dist < h.radius) {
                    health = Math.max(0, health - 35 * dt);
                    hurtFlashTimer = 0.1;
                    if (health <= 0) triggerDeath("COIL");
                }
            }
            if (h.life <= 0) hazards.splice(i, 1);
        }
    }

    if (!isSucking) {
        health = Math.max(0, health - 3.2 * dt);
        if (health <= 0) triggerDeath("STARVED");
    }

    if (!isSucking && !qteActive) {
        alertVal = Math.max(0, alertVal - 10 * dt);
    }

    // ---------------- 掌風機制：大幅加長前搖 (1.2 秒充足準備時間) ----------------
    if (alertVal >= 40) {
        windWaveTimer += dt;
        
        // 提早 1.2 秒啟動前搖警示！
        if (windWaveTimer >= 2.0 && !windWaveActive) {
            windWaveWarning = true;
            windWaveWarningTimer = 3.2 - windWaveTimer; // 倒數計時
        }
        
        // 前搖結束，掌風正式掃過
        if (windWaveTimer >= 3.2) {
            windWaveActive = true;
            windWaveWarning = false;
            windWaveX = mosquito.x - 340;
            windWaveTimer = 0;
        }
    } else {
        windWaveTimer = 0;
        windWaveActive = false;
        windWaveWarning = false;
    }

    if (windWaveActive) {
        windWaveX += 720 * dt;
        if (Math.abs(mosquito.x - windWaveX) < 45) {
            if (mosquito.invincibleTimer > 0) {
                showDodgeEffect();
                windWaveActive = false;
            } else {
                stopSuck();
                mosquito.x += (mosquito.x - windWaveX > 0 ? 90 : -90);
                windWaveActive = false;
                health = Math.max(0, health - 20);
                hurtFlashTimer = 0.25;
                if (health <= 0) triggerDeath("WIND_STRIKE");
            }
        }
        if (windWaveX > mosquito.x + 350) windWaveActive = false;
    }

    let muscleTight = alertVal >= 70;
    if (muscleTight) screenShakeTimer += dt * 15;

    // 暴露值 100% QTE
    if (alertVal >= 100 && !qteActive) {
        qteActive = true;
        qteTimer = 0.85;
        slapHandsDist = 1.0;
        document.getElementById("qte-overlay").style.display = "block";
    }

    if (qteActive) {
        qteTimer -= dt;
        slapHandsDist = Math.max(0, qteTimer / 0.85);
        if (qteTimer <= 0) triggerDeath("SLAPPED");
    }

    const currentTarget = getCurrentTarget();
    const statusText = document.getElementById("status-text");

    if (isSucking) {
        suckTick += dt * 18;

        if (!currentTarget) {
            statusText.innerText = "❌ 咬到衣服或背景！無法吸血";
            statusText.style.color = "#bbb";
        } else if (currentTarget.category === "BIRTHDAY_BOY") {
            let rateMod = muscleTight ? 0.5 : 1.0;
            let gain = (currentTarget.name.includes("臉") ? 22 : (currentTarget.name.includes("手") ? 15 : 10)) * rateMod;
            let alertSpd = currentTarget.name.includes("臉") ? 45 : (currentTarget.name.includes("手") ? 32 : 20);
            
            let prevEssence = essence;
            let prevAlert = alertVal;

            essence = Math.min(100, essence + gain * dt);
            alertVal = Math.min(100, alertVal + alertSpd * dt);
            health = Math.min(100, health + 14 * dt);
            
            if (prevAlert < 10 && alertVal >= 10 && !hasPromptedAlert10) {
                hasPromptedAlert10 = true;
                stopSuck();
                showAlert10Dialog();
            }

            if (prevEssence < 10 && essence >= 10 && !hasLearnedBlink) {
                hasLearnedBlink = true;
                updateBlinkBtnUI();
                stopSuck();
                showUnlockBlinkDialog();
            }

            if (essence >= 100 && !isStageComplete) {
                stopSuck();
                showWinDialog();
            }

            statusText.innerText = `🩸 汲取【${currentTarget.name}】精華液中！`;
            statusText.style.color = "#ff1744";

            if (Math.random() < 0.6) _spawnBlood(mosquito.facingRight ? 11 : -11, 16, true);
        } else if (currentTarget.category === "FAT_MAN") {
            health = Math.max(0, health - 40 * dt);
            alertVal = 100;
            statusText.innerText = "🌀 嘔！吸到胖子油膩毒血！暴露值爆表！";
            statusText.style.color = "#00e676";
            if (health <= 0) triggerDeath("POISONED");
        } else if (currentTarget.category === "OTHER_FRIEND") {
            let prevAlert = alertVal;
            alertVal = Math.min(100, alertVal + 26 * dt);
            health = Math.min(100, health + 10 * dt);

            if (prevAlert < 10 && alertVal >= 10 && !hasPromptedAlert10) {
                hasPromptedAlert10 = true;
                stopSuck();
                showAlert10Dialog();
            }

            statusText.innerText = `🩸 正在叮咬【${currentTarget.name}】(回血有效，精華無效)`;
            statusText.style.color = "#ff9100";
            if (Math.random() < 0.6) _spawnBlood(mosquito.facingRight ? 11 : -11, 16, true);
        }
    } else {
        if (!qteActive && hurtFlashTimer <= 0) {
            if (windWaveWarning) {
                statusText.innerText = hasLearnedBlink ? "⚠️ 掌風襲來預警！準備按【瞬移⚡】閃避！" : "⚠️ 掌風襲來預警！小心被重創！";
                statusText.style.color = "#ff1744";
            } else if (currentTarget) {
                if (currentTarget.category === "BIRTHDAY_BOY") {
                    statusText.innerText = `🟢 鎖定壽星部位：${currentTarget.name} (按住吸血)`;
                    statusText.style.color = "#76ff03";
                } else if (currentTarget.category === "FAT_MAN") {
                    statusText.innerText = `⚠️ 這是路人胖子！有毒別吸！`;
                    statusText.style.color = "#ff5252";
                } else {
                    statusText.innerText = `⚪ 發現目標：${currentTarget.name} (可吸血回血)`;
                    statusText.style.color = "#fff";
                }
            } else {
                statusText.innerText = "注意飢餓扣血！快找皮膚吸血或吃血袋！";
                statusText.style.color = "#ffeb3b";
            }
        }
    }

    updateParticles(dt);

    document.getElementById("essence-bar").style.width = essence + "%";
    document.getElementById("health-bar").style.width = health + "%";
    document.getElementById("alert-bar").style.width = alertVal + "%";

    render(currentTarget, now);
    requestAnimationFrame(gameLoop);
}

function updateParticles(dt) {
    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        let p = bloodParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= 2.2 * dt;
        if (!p.color) p.vy += 100 * dt;
        if (p.alpha <= 0) bloodParticles.splice(i, 1);
    }
    for (let i = blinkShadows.length - 1; i >= 0; i--) {
        blinkShadows[i].alpha -= 3.0 * dt;
        if (blinkShadows[i].alpha <= 0) blinkShadows.splice(i, 1);
    }
}

function _spawnBlood(offsetX, offsetY, isRed) {
    bloodParticles.push({
        x: mosquito.x + offsetX,
        y: mosquito.y + offsetY,
        vx: (Math.random() - 0.5) * 45,
        vy: -Math.random() * 60 - 20,
        radius: Math.random() * 1.8 + 1.0,
        alpha: 1.0,
        isRed: isRed
    });
}

function render(currentTarget, timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    
    let shakeX = 0, shakeY = 0;
    if (alertVal >= 70 && !mosquito.isDead) {
        shakeX = Math.sin(screenShakeTimer) * 1.8;
        shakeY = Math.cos(screenShakeTimer) * 1.8;
    }

    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x + shakeX, -camera.y + shakeY);

    if (assets.bg.complete) {
        ctx.drawImage(assets.bg, 0, 0, worldWidth, worldHeight);
    }

    if (showDebugBoxes) {
        const areas = getCharacterAreas();
        for (let a of areas) {
            ctx.save();
            if (a.category === "BIRTHDAY_BOY") {
                ctx.fillStyle = "rgba(76, 175, 80, 0.28)";
                ctx.strokeStyle = "rgba(76, 175, 80, 0.9)";
            } else if (a.category === "FAT_MAN") {
                ctx.fillStyle = "rgba(244, 67, 54, 0.28)";
                ctx.strokeStyle = "rgba(244, 67, 54, 0.9)";
            } else {
                ctx.fillStyle = "rgba(33, 150, 243, 0.28)";
                ctx.strokeStyle = "rgba(33, 150, 243, 0.9)";
            }
            ctx.lineWidth = 2;
            ctx.fillRect(a.x, a.y, a.w, a.h);
            ctx.strokeRect(a.x, a.y, a.w, a.h);
            ctx.font = "14px sans-serif";
            ctx.fillStyle = "#fff";
            ctx.fillText(a.name, a.x + 4, a.y + 18);
            ctx.restore();
        }
    }

    // 繪製動態飛行血包
    for (let bp of bloodPacks) {
        ctx.save();
        ctx.translate(bp.x, bp.y);

        const wingFlap = Math.sin(bp.floatPhase * 2.5) * 6;
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.beginPath();
        ctx.ellipse(-14, wingFlap, 9, 4, -0.3, 0, Math.PI * 2);
        ctx.ellipse(14, wingFlap, 9, 4, 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#d50000";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-bp.w / 2, -bp.h / 2, bp.w, bp.h, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.fillRect(-3, -8, 6, 16);
        ctx.fillRect(-8, -3, 16, 6);

        ctx.font = "bold 10px sans-serif";
        ctx.fillStyle = "#76ff03";
        ctx.textAlign = "center";
        ctx.fillText("+35 HP", 0, -18);
        ctx.restore();
    }

    for (let h of hazards) {
        ctx.save();
        if (h.type === "SPRAY") {
            let grad = ctx.createRadialGradient(h.x, h.y, 4, h.x, h.y, h.radius);
            grad.addColorStop(0, "rgba(255, 255, 255, 0.92)");
            grad.addColorStop(0.65, "rgba(230, 250, 255, 0.65)");
            grad.addColorStop(1, "rgba(255, 255, 255, 0.15)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "rgba(255, 235, 59, 0.95)";
            ctx.setLineDash([6, 5]);
            ctx.beginPath();
            ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
            ctx.strokeText("☠️ 殺蟲劑", h.x, h.y - h.radius - 8);
            ctx.fillStyle = "#fff59d";
            ctx.fillText("☠️ 殺蟲劑", h.x, h.y - h.radius - 8);

        } else if (h.type === "SWAT") {
            if (h.warnTimer > 0) {
                ctx.strokeStyle = "rgba(255, 23, 68, 0.85)";
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(h.x - h.width / 2, h.y - h.height / 2, h.width, h.height);
                ctx.font = "12px sans-serif";
                ctx.fillStyle = "#ff1744";
                ctx.fillText("⚡ 電蚊拍瞄準中！", h.x - 45, h.y - h.height / 2 - 6);
            } else {
                ctx.fillStyle = "rgba(0, 229, 255, 0.45)";
                ctx.strokeStyle = "#00e5ff";
                ctx.lineWidth = 3;
                ctx.fillRect(h.x - h.width / 2, h.y - h.height / 2, h.width, h.height);
                ctx.strokeRect(h.x - h.width / 2, h.y - h.height / 2, h.width, h.height);
            }
        } else if (h.type === "COIL") {
            ctx.translate(h.x, h.y);
            ctx.rotate(h.angle);
            ctx.strokeStyle = "#4e342e";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, h.radius, 0, Math.PI * 1.8);
            ctx.stroke();
            ctx.fillStyle = "#ff3d00";
            ctx.beginPath();
            ctx.arc(h.radius, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // ---------------- 強化版：掌風襲來 1.2 秒長前搖與動態危險軌道 ----------------
    if (windWaveWarning) {
        ctx.save();
        const curTime = timestamp || performance.now();
        const pulseAlpha = 0.25 + Math.sin(curTime / 100) * 0.15;

        // 1. 掌風整條即將橫掃的「紅色危險警戒區域軌道」
        ctx.fillStyle = `rgba(255, 23, 68, ${pulseAlpha})`;
        ctx.fillRect(mosquito.x - 120, 0, 90, worldHeight);

        // 2. 邊緣粗紅警示虛線
        ctx.strokeStyle = "rgba(255, 23, 68, 0.9)";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(mosquito.x - 120, 0);
        ctx.lineTo(mosquito.x - 120, worldHeight);
        ctx.moveTo(mosquito.x - 30, 0);
        ctx.lineTo(mosquito.x - 30, worldHeight);
        ctx.stroke();

        // 3. 醒目帶黑邊的文字提示牌
        ctx.setLineDash([]);
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(0, 0, 0, 0.9)";
        const warnText = hasLearnedBlink 
            ? `⚠️ 掌風襲來 (${windWaveWarningTimer.toFixed(1)}s)！按【瞬移⚡】閃避！` 
            : `⚠️ 掌風襲來 (${windWaveWarningTimer.toFixed(1)}s)！快閃開！`;
        
        ctx.strokeText(warnText, mosquito.x, mosquito.y - 36);
        ctx.fillStyle = "#ff1744";
        ctx.fillText(warnText, mosquito.x, mosquito.y - 36);
        ctx.restore();
    }

    if (windWaveActive) {
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillRect(windWaveX - 25, 0, 50, worldHeight);
        ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
        ctx.fillRect(windWaveX - 6, 0, 12, worldHeight);
        ctx.restore();
    }

    for (let s of blinkShadows) {
        ctx.save();
        ctx.translate(s.x, s.y);
        if (s.facingRight) ctx.scale(1, 1);
        else ctx.scale(-1, 1);
        ctx.globalAlpha = s.alpha * 0.6;
        if (assets.fly1.complete) {
            ctx.drawImage(assets.fly1, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
        }
        ctx.restore();
    }

    for (let p of bloodParticles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color ? p.color : `rgba(220, 20, 60, ${p.alpha})`;
        ctx.fill();
    }

    ctx.save();
    ctx.translate(mosquito.x, mosquito.y);
    
    const curTime = timestamp || performance.now();
    if (mosquito.invincibleTimer > 0 && Math.floor(curTime / 40) % 2 === 0) {
        ctx.globalAlpha = 0.4;
    }

    if (mosquito.isDead) {
        if (mosquito.deathType === "SLAPPED") {
            ctx.scale(1.8, 0.3);
            if (assets.dizzy.complete) ctx.drawImage(assets.dizzy, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
            ctx.save();
            ctx.scale(1 / 1.8, 1 / 0.3);
            ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
            ctx.beginPath();
            ctx.arc(0, soulY - 20, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "gold";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-6, soulY - 35, 12, 3);
            ctx.restore();
        } else {
            ctx.rotate(Math.PI);
            if (assets.dizzy.complete) ctx.drawImage(assets.dizzy, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
        }
    } else {
        if (mosquito.facingRight) ctx.scale(1, 1);
        else ctx.scale(-1, 1);

        let currentImg = assets.fly1;
        if (isSucking && currentTarget) {
            if (currentTarget.category === "FAT_MAN") {
                currentImg = assets.dizzy.complete ? assets.dizzy : assets.fly1;
                ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
            } else {
                currentImg = assets.suck.complete ? assets.suck : assets.fly1;
                ctx.translate(0, Math.sin(suckTick * 2.0) * 0.8);
            }
        } else {
            currentImg = mosquito.frame === 0 ? assets.fly1 : assets.fly2;
        }

        if (currentImg.complete) {
            ctx.drawImage(currentImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
        }
    }
    ctx.restore();

    if (qteActive && !mosquito.isDead) {
        ctx.save();
        const offset = slapHandsDist * 160;
        ctx.fillStyle = "rgba(20, 20, 20, 0.75)";
        ctx.beginPath();
        ctx.ellipse(mosquito.x - offset - 40, mosquito.y, 45, 60, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(mosquito.x + offset + 40, mosquito.y, 45, 60, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    ctx.restore();

    if (hurtFlashTimer > 0) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 0, 0, ${hurtFlashTimer * 1.5})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
    }
}

requestAnimationFrame(gameLoop);
</script>
