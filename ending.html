<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>忍者蚊子 - 結局與製作團隊名單</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 開場對話框容器 */
  #intro-modal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: opacity 0.4s ease;
  }

  .dialog-panel {
    background: rgba(25, 15, 35, 0.96);
    border: 3px solid #f39c12;
    border-radius: 16px;
    padding: 24px 28px;
    text-align: center;
    color: #fff;
    max-width: 440px;
    width: 88%;
    box-shadow: 0 0 30px rgba(243, 156, 18, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: manipulation;
  }

  .dialog-panel h3 {
    margin: 0 0 14px 0;
    color: #f1c40f;
    font-size: 20px;
    letter-spacing: 1px;
  }

  .dialog-img {
    max-width: 170px;
    max-height: 130px;
    object-fit: contain;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.4));
  }

  .dialog-panel p {
    font-size: 16px;
    font-weight: bold;
    line-height: 1.6;
    color: #ffeaa7;
    margin: 0 0 20px 0;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
  }

  .dialog-btn {
    background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
    color: #fff;
    border: 2px solid #f1c40f;
    padding: 10px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
    transition: transform 0.1s ease, filter 0.2s;
    touch-action: manipulation;
  }

  .dialog-btn:hover {
    filter: brightness(1.15);
  }

  .dialog-btn:active {
    transform: scale(0.95);
  }

  #credits-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    background: #000;
  }

  /* 滾動長軌道 */
  #credits-track {
    position: absolute;
    top: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: scrollCredits 7.2s cubic-bezier(0.22, 0.9, 0.35, 1) forwards;
    animation-play-state: paused;
  }

  #credits-track.running {
    animation-play-state: running;
  }

  /* 完整捲出名單，最後將大圖停在視窗正中央 */
  @keyframes scrollCredits {
    0% {
      transform: translateY(0);
      opacity: 0;
    }
    3% {
      opacity: 1;
    }
    100% {
      transform: translateY(calc(-100vh - 660px));
      opacity: 1;
    }
  }

  /* 字幕名單區域 */
  .text-credits-group {
    height: 660px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .game-title {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #f1c40f;
    text-shadow: 0 0 20px rgba(241, 196, 15, 0.8), 3px 3px 0 #c0392b;
    margin-bottom: 35px;
    text-align: center;
  }

  .credit-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
    white-space: nowrap;
  }

  .role-title {
    font-size: 24px;
    font-weight: 600;
    color: #bdc3c7;
    letter-spacing: 3px;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
  }

  .name-text {
    font-size: 32px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
  }

  /* 結局大圖包覆層：填滿視窗高寬 */
  .ending-img-wrapper {
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 放大展示的 ending.png */
  .ending-scroll-img {
    max-width: 96vw;
    max-height: 94vh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    border-radius: 14px;
    box-shadow: 0 0 45px rgba(241, 196, 15, 0.45);
  }

  /* 返回主選單按鈕 */
  .home-btn {
    position: absolute;
    bottom: 24px;
    right: 24px;
    padding: 12px 28px;
    background: rgba(30, 39, 46, 0.92);
    border: 2px solid #f39c12;
    border-radius: 30px;
    color: #f1c40f;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(243, 156, 18, 0.65);
    transition: all 0.2s ease;
    z-index: 30;
    touch-action: manipulation;
    opacity: 0;
    pointer-events: none;
  }

  .home-btn.show {
    opacity: 1;
    pointer-events: auto;
  }

  .home-btn:hover {
    background: #f39c12;
    color: #000;
    box-shadow: 0 0 25px rgba(241, 196, 15, 0.9);
  }

  .home-btn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<!-- 開場感謝對話框 -->
<div id="intro-modal">
  <div class="dialog-panel">
    <h3>✨ 壽星力維的真摯感謝</h3>
    <img src="mosquito_suck.png" alt="蚊子吸血" class="dialog-img" onerror="this.src='mosquito_fly_1.png'">
    <p>力維：「感謝你的吸力，終於把我身體裡的精華全吸出來了！」</p>
    <button class="dialog-btn" onclick="startEndingSequence()">開啟謝幕</button>
  </div>
</div>

<div id="credits-container">
  <div id="credits-track">
    <!-- 名單區域：會完全往上捲出視窗消失 -->
    <div class="text-credits-group">
      <div class="game-title">忍者蚊子 - 幫力維吸出來</div>

      <div class="credit-row">
        <span class="role-title">導演</span>
        <span class="name-text">aa38</span>
      </div>

      <div class="credit-row">
        <span class="role-title">編劇</span>
        <span class="name-text">aa38</span>
      </div>

      <div class="credit-row">
        <span class="role-title">美術設計</span>
        <span class="name-text">aa38</span>
      </div>

      <div class="credit-row">
        <span class="role-title">動作設計</span>
        <span class="name-text">aa38</span>
      </div>

      <div class="credit-row">
        <span class="role-title">製作</span>
        <span class="name-text">aa38</span>
      </div>
    </div>

    <!-- 緊接著捲上來並放大展示的結局照片 -->
    <div class="ending-img-wrapper">
      <img src="ending.png" alt="結局畫面" class="ending-scroll-img">
    </div>
  </div>
</div>

<a href="index.html" id="home-button" class="home-btn">🏠 返回主選單</a>

<script>
  const creditsTrack = document.getElementById('credits-track');
  const introModal = document.getElementById('intro-modal');
  const homeBtn = document.getElementById('home-button');
  const bgm = document.getElementById('bgm');

  function startEndingSequence() {
    if (bgm && bgm.paused) {
      bgm.play().catch(() => {});
    }

    introModal.style.opacity = '0';
    setTimeout(() => {
      introModal.style.display = 'none';
      window.scrollTo(0, 0);
    }, 400);

    creditsTrack.classList.add('running');
  }

  // 當軌道捲動完畢、ending.png 完美停在中央時顯示按鈕
  creditsTrack.addEventListener('animationend', () => {
    homeBtn.classList.add('show');
  });
</script>

</body>
</html>
