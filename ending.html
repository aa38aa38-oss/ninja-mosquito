<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>忍者蚊子 - 結局與製作團隊名單</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 開場感謝對話框：限制高度防止被工具列壓縮 */
  #intro-modal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100%;
    height: 100vh;
    height: 100dvh;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: opacity 0.35s ease;
  }

  .dialog-panel {
    background: rgba(25, 15, 35, 0.96);
    border: 3px solid #f39c12;
    border-radius: 16px;
    padding: 24px 28px;
    text-align: center;
    color: #fff;
    max-width: 440px;
    width: 88%;
    max-height: 85dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 0 30px rgba(243, 156, 18, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: manipulation;
  }

  .dialog-panel h3 {
    margin: 0 0 14px 0;
    color: #f1c40f;
    font-size: 20px;
    letter-spacing: 1px;
  }

  .dialog-img {
    max-width: 170px;
    max-height: 130px;
    object-fit: contain;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.4));
  }

  .dialog-panel p {
    font-size: 16px;
    font-weight: bold;
    line-height: 1.6;
    color: #ffeaa7;
    margin: 0 0 20px 0;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
  }

  .dialog-btn {
    background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
    color: #fff;
    border: 2px solid #f1c40f;
    padding: 10px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
    transition: transform 0.1s ease, filter 0.2s;
    touch-action: manipulation;
  }

  .dialog-btn:hover {
    filter: brightness(1.15);
  }

  .dialog-btn:active {
    transform: scale(0.95);
  }

  #credits-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    z-index: 10;
    background: #000;
  }

  /* 捲動速度設定為 3.6 秒 */
  #credits-track {
    position: absolute;
    top: 100%;
    width: 90%;
    max-width: 760px;
    text-align: center;
    animation: scrollCredits 3.6s linear forwards;
    animation-play-state: paused;
  }

  #credits-track.running {
    animation-play-state: running;
  }

  @keyframes scrollCredits {
    0% {
      top: 100%;
      opacity: 0;
    }
    4% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      top: -160%;
      opacity: 0;
    }
  }

  .game-title {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #f1c40f;
    text-shadow: 0 0 20px rgba(241, 196, 15, 0.8), 3px 3px 0 #c0392b;
    margin-bottom: 50px;
  }

  .credit-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
    white-space: nowrap;
  }

  .role-title {
    font-size: 24px;
    font-weight: 600;
    color: #bdc3c7;
    letter-spacing: 3px;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
  }

  .name-text {
    font-size: 32px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
  }

  /* 最終畫面淡入加速至 0.1 秒 */
  #final-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease-in-out;
    background-color: #000;
    z-index: 20;
  }

  #final-screen.show {
    opacity: 1;
    pointer-events: auto;
  }

  .ending-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: 100%;
    object-fit: contain;
    display: block;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
  }

  /* 返回主選單按鈕：動態避讓 Safari 網址列、iPhone 小黑條及 Android 虛擬導航列 */
  .home-btn {
    position: absolute;
    bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 16px));
    right: max(24px, calc(env(safe-area-inset-right, 0px) + 16px));
    padding: 12px 26px;
    background: rgba(30, 39, 46, 0.88);
    border: 2px solid #f39c12;
    border-radius: 30px;
    color: #f1c40f;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
    transition: all 0.2s ease;
    z-index: 30;
    touch-action: manipulation;
  }

  .home-btn:hover {
    background: #f39c12;
    color: #000;
    box-shadow: 0 0 25px rgba(241, 196, 15, 0.8);
  }

  .home-btn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<!-- 開場感謝對話框 -->
<div id="intro-modal">
  <div class="dialog-panel">
    <h3>✨ 壽星力維的真摯感謝</h3>
    <img src="mosquito_suck.png" alt="蚊子吸血" class="dialog-img" onerror="this.src='mosquito_fly_1.png'">
    <p>力維：「感謝你的吸力，終於把我身體裡的精華全吸出來了！」</p>
    <button class="dialog-btn" onclick="startEndingSequence()">開啟謝幕</button>
  </div>
</div>

<div id="credits-container">
  <div id="credits-track">
    <div class="game-title">忍者蚊子 - 幫力維吸出來</div>

    <div class="credit-row">
      <span class="role-title">導演</span>
      <span class="name-text">aa38</span>
    </div>

    <div class="credit-row">
      <span class="role-title">編劇</span>
      <span class="name-text">aa38</span>
    </div>

    <div class="credit-row">
      <span class="role-title">美術設計</span>
      <span class="name-text">aa38</span>
    </div>

    <div class="credit-row">
      <span class="role-title">動作設計</span>
      <span class="name-text">aa38</span>
    </div>

    <div class="credit-row">
      <span class="role-title">製作</span>
      <span class="name-text">aa38</span>
    </div>
  </div>
</div>

<div id="final-screen">
  <img src="ending.png" alt="結局畫面" class="ending-img">
  <a href="index.html" class="home-btn">🏠 返回主選單</a>
</div>

<script>
  const creditsTrack = document.getElementById('credits-track');
  const creditsContainer = document.getElementById('credits-container');
  const finalScreen = document.getElementById('final-screen');
  const introModal = document.getElementById('intro-modal');
  const bgm = document.getElementById('bgm');

  function startEndingSequence() {
    if (bgm && bgm.paused) {
      bgm.play().catch(() => {});
    }

    introModal.style.opacity = '0';
    setTimeout(() => {
      introModal.style.display = 'none';
      window.scrollTo(0, 0);
    }, 350);

    creditsTrack.classList.add('running');
  }

  creditsTrack.addEventListener('animationend', () => {
    creditsContainer.style.display = 'none';
    finalScreen.classList.add('show');
    window.scrollTo(0, 0);
  });
</script>

</body>
</html>
