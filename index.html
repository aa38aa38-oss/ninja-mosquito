<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>忍者蚊子：血之試煉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- 頂部資訊列 -->
    <div id="hud">
      <div class="hud-item">關卡: <span id="level-display">1</span></div>
      <div class="hud-item">查克拉 (血量): <span id="blood-display">0%</span></div>
      <div class="hud-item">人類警戒: <span id="alert-display">0%</span></div>
    </div>

    <!-- 狀態條 -->
    <div id="bars">
      <div class="bar-container">
        <div id="blood-bar" class="bar-fill blood-fill"></div>
      </div>
      <div class="bar-container">
        <div id="alert-bar" class="bar-fill alert-fill"></div>
      </div>
    </div>

    <!-- 遊戲主畫布 (手機直式 360x600) -->
    <canvas id="gameCanvas" width="360" height="600"></canvas>

    <!-- 技能按鈕區 -->
    <div id="skill-controls">
      <button id="skill-btn" class="game-btn disabled">無技能</button>
    </div>

    <!-- 訊息提示與彈窗面板 -->
    <div id="message-overlay" class="overlay">
      <div class="modal">
        <h2 id="modal-title">忍者蚊子傳說</h2>
        <p id="modal-desc">滑動螢幕控制蚊子飛行，停留在人類裸露皮膚上即可吸取查克拉。注意人類的警覺動靜！</p>
        <button id="start-btn" class="action-btn">開始任務</button>
      </div>
    </div>
  </div>

  <!-- 依序載入各關卡與主邏輯 -->
  <script src="level1.js"></script>
  <script src="level2.js"></script>
  <script src="level3.js"></script>
  <script src="game.js"></script>
</body>
</html>
