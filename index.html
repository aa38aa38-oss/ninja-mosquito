<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>忍者蚊子 - 幫力維吸出來</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #home-container {
            position: relative;
            width: 100vw;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* 智慧動態邊距：同時適應 Safari 工具列、iPhone 小黑條及 Android 虛擬鍵 */
            padding-bottom: max(30px, calc(env(safe-area-inset-bottom, 0px) + 20px));
            overflow: hidden;
        }
        #cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }
        .btn-container {
            position: relative;
            z-index: 10;
            width: 82%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }
        .portal-btn {
            width: 100%;
            padding: 15px 0;
            border-radius: 35px;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            text-decoration: none;
            display: block;
            transition: transform 0.1s ease, box-shadow 0.15s ease;
            touch-action: manipulation;
        }
        #start-btn {
            background: linear-gradient(135deg, #ff1744 0%, #d50000 100%);
            border: 2px solid #ff8a80;
            box-shadow: 0 0 22px rgba(255, 23, 68, 0.85);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1.0); box-shadow: 0 0 16px rgba(255, 23, 68, 0.7); }
            100% { transform: scale(1.04); box-shadow: 0 0 28px rgba(255, 23, 68, 1); }
        }
        #help-btn {
            background: rgba(20, 20, 30, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }
        .portal-btn:active {
            transform: scale(0.93) !important;
        }
        #help-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86%;
            max-width: 360px;
            max-height: 85dvh;
            overflow-y: auto;
            background: rgba(15, 15, 25, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 18px;
            padding: 22px 20px;
            color: #fff;
            display: none;
            z-index: 100;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-overflow-scrolling: touch;
        }
        #help-modal h3 {
            color: #00e5ff;
            margin-bottom: 12px;
            font-size: 20px;
            text-align: center;
        }
        #help-modal p {
            font-size: 13.5px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 8px;
        }
        #close-modal {
            margin-top: 15px;
            width: 100%;
            padding: 10px 0;
            background: #00b0ff;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div id="home-container">
    <img id="cover-img" src="cover.png" alt="封面" onerror="tryNext(this)">

    <div class="btn-container">
        <div id="start-btn" class="portal-btn" onclick="startGame()">START GAME</div>
        <div id="help-btn" class="portal-btn" onclick="openHelp()">HOW TO PLAY</div>
    </div>

    <div id="help-modal">
        <h3>🥷 忍者蚊子修練指南</h3>
        <p>1. <b>飢餓生存</b>：未吸血時體力持續扣減，必須找皮膚吸血回血！</p>
        <p>2. <b>目標鎖定</b>：吸【壽星（黑衣雙讚）】累積精華液；吸【胖子】會中毒扣血暴斃！</p>
        <p>3. <b>瞬移閃避</b>：推動搖桿時按【⚡ 瞬移】，可穿透閃避掌風、電蚊拍與殺蟲劑！</p>
        <p>4. <b>巨掌 QTE</b>：警覺度 100% 時巨掌將合圍，看準時機按瞬移逃出生天！</p>
        <button id="close-modal" onclick="closeHelp()">我知道了！出發！</button>
    </div>
</div>

<script>
const fallbackImages = ['cover.PNG', 'cover.jpg', 'cover.jpeg', '封面.png'];
let fallbackIndex = 0;

function tryNext(img) {
    if (fallbackIndex < fallbackImages.length) {
        img.src = fallbackImages[fallbackIndex++];
    }
}

function startGame() {
    window.location.href = 'game.html';
}

function openHelp() {
    document.getElementById('help-modal').style.display = 'block';
}

function closeHelp() {
    document.getElementById('help-modal').style.display = 'none';
}
</script>
</body>
</html>
