<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>忍者蚊子 - 壽星血宴</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 頂部 HUD (半透明懸浮) */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            left: 20px;
            width: 290px;
            max-width: 65vw;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 30;
        }
        #status-text {
            font-size: 15px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 6px;
            white-space: nowrap;
        }
        .bar-container {
            margin-bottom: 4px;
        }
        .bar-label {
            font-size: 11px;
            margin-bottom: 2px;
            color: #ddd;
        }
        .progress-bg {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            overflow: hidden;
        }
        #essence-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff1744, #ff5252);
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #43a047, #76ff03);
            transition: width 0.1s ease-out;
        }
        #alert-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9100, #d50000);
        }

        /* 左半邊動態搖桿感應區 */
        #touch-left-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 55vw;
            height: 100vh;
            z-index: 10;
            touch-action: none;
        }
        #arena-joystick {
            position: absolute;
            width: 140px;
            height: 140px;
            margin-left: -70px;
            margin-top: -70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.45) 80%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: none;
            z-index: 15;
        }
        #arena-knob {
            position: absolute;
            width: 56px;
            height: 56px;
            top: 42px;
            left: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(200, 200, 200, 0.6) 100%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        /* 右側動作按鈕 */
        #action-container {
            position: absolute;
            right: 25px;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 25;
            touch-action: none;
        }
        .hud-btn {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            touch-action: none;
            transition: transform 0.08s ease;
        }
        #suck-btn {
            background: radial-gradient(circle, rgba(229, 57, 53, 0.8) 0%, rgba(183, 28, 28, 0.8) 100%);
            border: 2.5px solid rgba(255, 138, 128, 0.7);
            box-shadow: 0 0 16px rgba(211, 47, 47, 0.6);
        }
        #suck-btn:active, #suck-btn.pressed {
            transform: scale(0.9);
            background: radial-gradient(circle, rgba(255, 23, 68, 0.95) 0%, rgba(213, 0, 0, 0.95) 100%);
        }
        #skill-btn {
            background: radial-gradient(circle, rgba(66, 66, 66, 0.75) 0%, rgba(33, 33, 33, 0.85) 100%);
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }
        #skill-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="touch-left-zone"></div>
    <div id="arena-joystick">
        <div id="arena-knob"></div>
    </div>

    <div id="hud">
        <div id="status-text">目標：探索合照尋找壽星</div>
        <div class="bar-container">
            <div class="bar-label">壽星精華液</div>
            <div class="progress-bg"><div id="essence-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">蚊子生命值</div>
            <div class="progress-bg"><div id="health-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">現場警覺度</div>
            <div class="progress-bg"><div id="alert-bar"></div></div>
        </div>
    </div>

    <div id="action-container">
        <div id="suck-btn" class="hud-btn">💉 吸血</div>
        <div id="skill-btn" class="hud-btn">💨 忍術</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const assets = {
    bg: new Image(),
    fly1: new Image(),
    fly2: new Image(),
    suck: new Image(),
    dizzy: new Image()
};
assets.bg.src = "bg_level1.png";
assets.fly1.src = "mosquito_fly_1.png";
assets.fly2.src = "mosquito_fly_2.png";
assets.suck.src = "mosquito_suck.png";
assets.dizzy.src = "mosquito_dizzy.png";

let worldWidth = 1080;
let worldHeight = 1920;

assets.bg.onload = function() {
    worldWidth = assets.bg.naturalWidth || 1080;
    worldHeight = assets.bg.naturalHeight || 1920;
    // 預設誕生在壽星小腿附近
    mosquito.x = worldWidth * 0.52;
    mosquito.y = worldHeight * 0.74;
};

const camera = { x: 0, y: 0, zoom: 3.8 };

const mosquito = {
    x: 550,
    y: 1300,
    size: 48,
    speed: 280,
    dashSpeed: 1600,
    facingRight: true,
    frame: 0,
    frameTimer: 0
};

// 數值系統
let essence = 0;      // 壽星精華液 (0 ~ 100)
let health = 100;     // 蚊子生命值 (0 ~ 100)
let alertVal = 0;     // 警覺度 (0 ~ 100)

let isSucking = false;
let isDashing = false;
let dashTime = 0;
let skillCooldown = 0;
let joyVector = { x: 0, y: 0 };

let bloodParticles = [];

// 精準定義合照中四個人的人體皮膚分區 (相對於世界地圖像素寬高)
function getCharacterAreas() {
    return [
        // 1. 壽星（情況 1：右二男子，黑T比雙讚）
        { category: "BIRTHDAY_BOY", name: "壽星小腿", x: worldWidth * 0.46, y: worldHeight * 0.65, w: worldWidth * 0.11, h: worldHeight * 0.22 },
        { category: "BIRTHDAY_BOY", name: "壽星手臂", x: worldWidth * 0.55, y: worldHeight * 0.40, w: worldWidth * 0.11, h: worldHeight * 0.16 },
        { category: "BIRTHDAY_BOY", name: "壽星臉部", x: worldWidth * 0.48, y: worldHeight * 0.22, w: worldWidth * 0.10, h: worldHeight * 0.13 },

        // 2. 胖子（情況 2：左二男子，黑背心戴眼鏡）
        { category: "FAT_MAN", name: "胖子手臂與身體", x: worldWidth * 0.24, y: worldHeight * 0.32, w: worldWidth * 0.16, h: worldHeight * 0.28 },
        { category: "FAT_MAN", name: "胖子小腿", x: worldWidth * 0.23, y: worldHeight * 0.62, w: worldWidth * 0.14, h: worldHeight * 0.24 },

        // 3. 其他朋友 A（情況 3：左一白球衣朋友）
        { category: "OTHER_FRIEND", name: "白衣朋友手臂", x: worldWidth * 0.08, y: worldHeight * 0.38, w: worldWidth * 0.14, h: worldHeight * 0.20 },
        { category: "OTHER_FRIEND", name: "白衣朋友小腿", x: worldWidth * 0.10, y: worldHeight * 0.64, w: worldWidth * 0.12, h: worldHeight * 0.24 },

        // 3. 其他朋友 B（情況 3：右一灰衣朋友）
        { category: "OTHER_FRIEND", name: "灰衣朋友臉部與頸部", x: worldWidth * 0.68, y: worldHeight * 0.22, w: worldWidth * 0.10, h: worldHeight * 0.13 },
        { category: "OTHER_FRIEND", name: "灰衣朋友手臂", x: worldWidth * 0.67, y: worldHeight * 0.38, w: worldWidth * 0.11, h: worldHeight * 0.20 },
        { category: "OTHER_FRIEND", name: "灰衣朋友腳踝", x: worldWidth * 0.70, y: worldHeight * 0.78, w: worldWidth * 0.09, h: worldHeight * 0.12 }
    ];
}

// 判定當前蚊子停靠處
function getCurrentTarget() {
    const areas = getCharacterAreas();
    for (let a of areas) {
        if (mosquito.x >= a.x && mosquito.x <= a.x + a.w &&
            mosquito.y >= a.y && mosquito.y <= a.y + a.h) {
            return a;
        }
    }
    // 不在任何皮膚上（情況 4：背景/衣物）
    return null;
}

// 虛擬搖桿
const leftZone = document.getElementById("touch-left-zone");
const arenaJoy = document.getElementById("arena-joystick");
const arenaKnob = document.getElementById("arena-knob");
let joyActive = false;
let joyOrigin = { x: 0, y: 0 };
let currentTouchId = null;

function onJoyStart(clientX, clientY, touchId = null) {
    joyActive = true;
    currentTouchId = touchId;
    joyOrigin = { x: clientX, y: clientY };
    arenaJoy.style.left = clientX + "px";
    arenaJoy.style.top = clientY + "px";
    arenaJoy.style.display = "block";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

function onJoyMove(clientX, clientY) {
    if (!joyActive) return;
    let dx = clientX - joyOrigin.x;
    let dy = clientY - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    const maxRadius = 55;
    if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
    }
    arenaKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVector = { x: dx / maxRadius, y: dy / maxRadius };
}

function onJoyEnd() {
    joyActive = false;
    currentTouchId = null;
    arenaJoy.style.display = "none";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

leftZone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (joyActive) return;
    const t = e.changedTouches[0];
    onJoyStart(t.clientX, t.clientY, t.identifier);
});
window.addEventListener("touchmove", (e) => {
    if (!joyActive) return;
    for (let t of e.touches) {
        if (t.identifier === currentTouchId) {
            onJoyMove(t.clientX, t.clientY);
            break;
        }
    }
});
window.addEventListener("touchend", (e) => {
    if (!joyActive) return;
    for (let t of e.changedTouches) {
        if (t.identifier === currentTouchId) {
            onJoyEnd();
            break;
        }
    }
});

leftZone.addEventListener("mousedown", (e) => onJoyStart(e.clientX, e.clientY));
window.addEventListener("mousemove", (e) => { if (joyActive && currentTouchId === null) onJoyMove(e.clientX, e.clientY); });
window.addEventListener("mouseup", (e) => { if (joyActive && currentTouchId === null) onJoyEnd(); });

// 按鈕
const suckBtn = document.getElementById("suck-btn");
const skillBtn = document.getElementById("skill-btn");

function startSuck() { isSucking = true; suckBtn.classList.add("pressed"); }
function stopSuck() { isSucking = false; suckBtn.classList.remove("pressed"); }

suckBtn.addEventListener("mousedown", startSuck);
window.addEventListener("mouseup", stopSuck);
suckBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startSuck(); });
window.addEventListener("touchend", stopSuck);

skillBtn.addEventListener("click", () => {
    if (skillCooldown <= 0 && !isDashing) {
        isDashing = true;
        dashTime = 0.16;
        skillCooldown = 1.5;
        stopSuck();
    }
});

let lastTime = performance.now();
let suckTick = 0;

function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (skillCooldown > 0) {
        skillCooldown -= dt;
        skillBtn.innerText = skillCooldown > 0 ? skillCooldown.toFixed(1) : "💨 忍術";
        skillBtn.style.opacity = skillCooldown > 0 ? "0.6" : "1";
    }

    if (isDashing) {
        dashTime -= dt;
        mosquito.y -= mosquito.dashSpeed * dt;
        if (dashTime <= 0) isDashing = false;
    } else {
        if (joyVector.x !== 0 || joyVector.y !== 0) {
            mosquito.x += joyVector.x * mosquito.speed * dt;
            mosquito.y += joyVector.y * mosquito.speed * dt;
            
            if (joyVector.x > 0.05) {
                mosquito.facingRight = true;
            } else if (joyVector.x < -0.05) {
                mosquito.facingRight = false;
            }
            stopSuck();
        }
    }

    mosquito.x = Math.max(30, Math.min(worldWidth - 30, mosquito.x));
    mosquito.y = Math.max(30, Math.min(worldHeight - 30, mosquito.y));

    // 鏡頭鎖定
    const targetCamX = mosquito.x - (canvas.width / 2) / camera.zoom;
    const targetCamY = mosquito.y - (canvas.height / 2) / camera.zoom;
    camera.x += (targetCamX - camera.x) * 0.14;
    camera.y += (targetCamY - camera.y) * 0.14;

    mosquito.frameTimer += dt;
    if (mosquito.frameTimer > 0.09) {
        mosquito.frame = mosquito.frame === 0 ? 1 : 0;
        mosquito.frameTimer = 0;
    }

    // 核心：四種吸血情況判定
    const currentTarget = getCurrentTarget();
    const statusText = document.getElementById("status-text");

    if (isSucking) {
        suckTick += dt * 18;

        if (!currentTarget) {
            // 情況 4：咬在非皮膚部位 (背景、衣物) -> 無變化
            statusText.innerText = "❌ 咬到衣服或背景！無法吸血";
            statusText.style.color = "#bbb";
            alertVal = Math.max(0, alertVal - 10 * dt);
        } else if (currentTarget.category === "BIRTHDAY_BOY") {
            // 情況 1：吸到壽星 -> 增加精華液與警覺度
            essence = Math.min(100, essence + 22 * dt);
            alertVal = Math.min(100, alertVal + 24 * dt);
            statusText.innerText = `🩸 正在汲取【${currentTarget.name}】純度精華！`;
            statusText.style.color = "#ff1744";

            // 生成鮮血粒子
            if (Math.random() < 0.6) {
                _spawnBlood(mosquito.facingRight ? 16 : -16, 24, true);
            }
        } else if (currentTarget.category === "FAT_MAN") {
            // 情況 2：吸到胖子 -> 扣除生命值，陷入中毒暈眩
            health = Math.max(0, health - 35 * dt);
            alertVal = Math.min(100, alertVal + 60 * dt);
            statusText.innerText = "🌀 嘔！吸到胖子油膩毒血！生命受損！";
            statusText.style.color = "#00e676";
        } else if (currentTarget.category === "OTHER_FRIEND") {
            // 情況 3：吸到其他兩位朋友 -> 有吸血動作與特效，但精華液不變 (0%)
            alertVal = Math.min(100, alertVal + 18 * dt);
            statusText.innerText = `🩸 正在叮咬【${currentTarget.name}】... 但精華無效！`;
            statusText.style.color = "#ff9100";

            if (Math.random() < 0.6) {
                _spawnBlood(mosquito.facingRight ? 16 : -16, 24, true);
            }
        }
    } else {
        alertVal = Math.max(0, alertVal - 12 * dt);
        if (currentTarget) {
            if (currentTarget.category === "BIRTHDAY_BOY") {
                statusText.innerText = `🟢 鎖定壽星部位：${currentTarget.name} (按住吸血)`;
                statusText.style.color = "#76ff03";
            } else if (currentTarget.category === "FAT_MAN") {
                statusText.innerText = "⚠️ 這是路人胖子！(吸了會扣命中毒)";
                statusText.style.color = "#ff5252";
            } else {
                statusText.innerText = `⚪ 發現目標：${currentTarget.name} (按住吸血)`;
                statusText.style.color = "#fff";
            }
        } else {
            statusText.innerText = "目標：探索合照尋找壽星";
            statusText.style.color = "#ffeb3b";
        }
    }

    // 更新血滴物理軌跡
    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        let p = bloodParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 120 * dt;
        p.alpha -= 2.2 * dt;
        if (p.alpha <= 0) bloodParticles.splice(i, 1);
    }

    document.getElementById("essence-bar").style.width = essence + "%";
    document.getElementById("health-bar").style.width = health + "%";
    document.getElementById("alert-bar").style.width = alertVal + "%";

    render(currentTarget);
    requestAnimationFrame(gameLoop);
}

function _spawnBlood(offsetX, offsetY, isRed) {
    bloodParticles.push({
        x: mosquito.x + offsetX,
        y: mosquito.y + offsetY,
        vx: (Math.random() - 0.5) * 60,
        vy: -Math.random() * 80 - 30,
        radius: Math.random() * 2.5 + 1.5,
        alpha: 1.0,
        isRed: isRed
    });
}

function render(currentTarget) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    if (assets.bg.complete) {
        ctx.drawImage(assets.bg, 0, 0, worldWidth, worldHeight);
    } else {
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, worldWidth, worldHeight);
    }

    const needleTipX = mosquito.x + (mosquito.facingRight ? 16 : -16);
    const needleTipY = mosquito.y + 24;

    // --- 繪製吸血特效 (只有情況 1、2、3 有特效，情況 4 什麼都沒有) ---
    if (isSucking && currentTarget) {
        if (currentTarget.category === "FAT_MAN") {
            // 情況 2：胖子暗綠毒光圈
            ctx.beginPath();
            ctx.arc(needleTipX, needleTipY, 8, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 230, 118, 0.4)";
            ctx.fill();
        } else {
            // 情況 1 與 情況 3：真實鮮紅噴灑特效
            const pulseRadius = 7 + Math.sin(suckTick * 1.5) * 2.5;
            ctx.beginPath();
            ctx.arc(needleTipX, needleTipY, pulseRadius + 5, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 23, 68, 0.35)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(needleTipX, needleTipY, pulseRadius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 23, 68, 0.85)";
            ctx.fill();

            // 針管抽取光柱
            const barrelTopX = mosquito.x + (mosquito.facingRight ? 12 : -12);
            const barrelTopY = mosquito.y - 4;
            ctx.beginPath();
            ctx.moveTo(needleTipX, needleTipY);
            ctx.lineTo(barrelTopX, barrelTopY);
            ctx.lineWidth = 3.5 + Math.sin(suckTick * 2.0) * 1.0;
            ctx.strokeStyle = "rgba(255, 60, 60, 0.9)";
            ctx.stroke();

            // 上浮氣泡
            for (let i = 0; i < 3; i++) {
                let t = ((suckTick * 0.15) + i * 0.33) % 1;
                let bx = needleTipX + (barrelTopX - needleTipX) * t;
                let by = needleTipY + (barrelTopY - needleTipY) * t;
                ctx.beginPath();
                ctx.arc(bx, by, 1.6, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
                ctx.fill();
            }

            // 噴濺血粒子
            for (let p of bloodParticles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220, 20, 60, ${p.alpha})`;
                ctx.fill();
            }
        }
    }

    // --- 繪製蚊子角色 ---
    ctx.save();
    ctx.translate(mosquito.x, mosquito.y);
    
    // 朝向判定
    if (mosquito.facingRight) {
        ctx.scale(1, 1);
    } else {
        ctx.scale(-1, 1);
    }

    let currentImg = assets.fly1;

    // 只有停靠在人體（情況 1、2、3）吸血時才換圖；情況 4 (咬在背景) 維持原樣飛行拍翅
    if (isSucking && currentTarget) {
        if (currentTarget.category === "FAT_MAN") {
            // 情況 2：吸到胖子切換蚊香眼暈眩圖
            currentImg = assets.dizzy.complete ? assets.dizzy : assets.fly1;
            ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
        } else {
            // 情況 1 與 情況 3：持針筒扎馬步專注吸血
            currentImg = assets.suck.complete ? assets.suck : assets.fly1;
            ctx.translate(0, Math.sin(suckTick * 2.0) * 1.2);
        }
    } else {
        // 常規飛行拍翅
        currentImg = mosquito.frame === 0 ? assets.fly1 : assets.fly2;
    }

    if (currentImg.complete) {
        ctx.drawImage(currentImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
    }
    ctx.restore();

    ctx.restore();
}

requestAnimationFrame(gameLoop);
</script>
