<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>忍者蚊子 - 壽星血宴</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 頂部 HUD (半透明懸浮) */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            left: 20px;
            width: 280px;
            max-width: 65vw;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 30;
        }
        #status-text {
            font-size: 15px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 6px;
            white-space: nowrap;
        }
        .bar-container {
            margin-bottom: 4px;
        }
        .bar-label {
            font-size: 11px;
            margin-bottom: 2px;
            color: #ddd;
        }
        .progress-bg {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            overflow: hidden;
        }
        #essence-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff1744, #ff5252);
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #43a047, #76ff03);
            transition: width 0.1s ease-out;
        }
        #alert-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9100, #d50000);
        }

        /* 右上角：熱區顯示開關按鈕 (方便即時檢視所有人的臉、手、腿框框) */
        #debug-btn {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            right: 20px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            color: #fff;
            font-size: 12px;
            z-index: 35;
            cursor: pointer;
        }

        /* 左半邊動態搖桿感應區 */
        #touch-left-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 55vw;
            height: 100vh;
            z-index: 10;
            touch-action: none;
        }
        #arena-joystick {
            position: absolute;
            width: 140px;
            height: 140px;
            margin-left: -70px;
            margin-top: -70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.45) 80%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: none;
            z-index: 15;
        }
        #arena-knob {
            position: absolute;
            width: 56px;
            height: 56px;
            top: 42px;
            left: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(200, 200, 200, 0.6) 100%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        /* 右側動作按鈕 */
        #action-container {
            position: absolute;
            right: 25px;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 25;
            touch-action: none;
        }
        .hud-btn {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            touch-action: none;
            transition: transform 0.08s ease;
        }
        #suck-btn {
            background: radial-gradient(circle, rgba(229, 57, 53, 0.8) 0%, rgba(183, 28, 28, 0.8) 100%);
            border: 2.5px solid rgba(255, 138, 128, 0.7);
            box-shadow: 0 0 16px rgba(211, 47, 47, 0.6);
        }
        #suck-btn:active, #suck-btn.pressed {
            transform: scale(0.9);
            background: radial-gradient(circle, rgba(255, 23, 68, 0.95) 0%, rgba(213, 0, 0, 0.95) 100%);
        }
        #skill-btn {
            background: radial-gradient(circle, rgba(66, 66, 66, 0.75) 0%, rgba(33, 33, 33, 0.85) 100%);
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }
        #skill-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="touch-left-zone"></div>
    <div id="arena-joystick">
        <div id="arena-knob"></div>
    </div>

    <!-- 熱區檢視切換 -->
    <div id="debug-btn">👁️ 顯示熱區</div>

    <div id="hud">
        <div id="status-text">目標：探索合照尋找壽星</div>
        <div class="bar-container">
            <div class="bar-label">壽星精華液</div>
            <div class="progress-bg"><div id="essence-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">蚊子生命值</div>
            <div class="progress-bg"><div id="health-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">現場警覺度</div>
            <div class="progress-bg"><div id="alert-bar"></div></div>
        </div>
    </div>

    <div id="action-container">
        <div id="suck-btn" class="hud-btn">💉 吸血</div>
        <div id="skill-btn" class="hud-btn">💨 忍術</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const assets = {
    bg: new Image(),
    fly1: new Image(),
    fly2: new Image(),
    suck: new Image(),
    dizzy: new Image()
};
assets.bg.src = "bg_level1.png";
assets.fly1.src = "mosquito_fly_1.png";
assets.fly2.src = "mosquito_fly_2.png";
assets.suck.src = "mosquito_suck.png";
assets.dizzy.src = "mosquito_dizzy.png";

let worldWidth = 1080;
let worldHeight = 1920;

assets.bg.onload = function() {
    worldWidth = assets.bg.naturalWidth || 1080;
    worldHeight = assets.bg.naturalHeight || 1920;
    mosquito.x = worldWidth * 0.52;
    mosquito.y = worldHeight * 0.74;
};

// 保持大視野特寫倍率
const camera = { x: 0, y: 0, zoom: 3.8 };

// 【蚊子縮小】：直徑從 48px 進一步縮小為 32px，真正昆蟲比例！
const mosquito = {
    x: 550,
    y: 1300,
    size: 32,
    speed: 260,
    dashSpeed: 1500,
    facingRight: true,
    frame: 0,
    frameTimer: 0
};

let essence = 0;
let health = 100;
let alertVal = 0;

let isSucking = false;
let isDashing = false;
let dashTime = 0;
let skillCooldown = 0;
let joyVector = { x: 0, y: 0 };

let bloodParticles = [];
let showDebugBoxes = false; // 是否顯示熱區框

// 熱區開關切換
document.getElementById("debug-btn").addEventListener("click", () => {
    showDebugBoxes = !showDebugBoxes;
    document.getElementById("debug-btn").innerText = showDebugBoxes ? "關閉熱區" : "👁️ 顯示熱區";
});

// 【核心修正】：精準重配全圖四個人的臉部、手臂、腿部位置
// 依據原始合照高度：臉部在頂部 8%~26%，手臂在 24%~48%，小腿在 58%~88%
function getCharacterAreas() {
    return [
        // ---------------- 1. 壽星 (右二，黑衣比雙讚，主角) ----------------
        // 壽星臉部 (戴眼鏡、開心笑臉)
        { category: "BIRTHDAY_BOY", name: "壽星臉部", x: worldWidth * 0.47, y: worldHeight * 0.08, w: worldWidth * 0.13, h: worldHeight * 0.16 },
        // 壽星比讚手臂 (左右兩隻露出的小臂與手勢)
        { category: "BIRTHDAY_BOY", name: "壽星雙手手臂", x: worldWidth * 0.44, y: worldHeight * 0.24, w: worldWidth * 0.18, h: worldHeight * 0.17 },
        // 壽星短褲下的小腿與拖鞋
        { category: "BIRTHDAY_BOY", name: "壽星小腿", x: worldWidth * 0.46, y: worldHeight * 0.58, w: worldWidth * 0.12, h: worldHeight * 0.28 },

        // ---------------- 2. 胖子 (左二，黑背心，懲罰目標) ----------------
        // 胖子頭臉部
        { category: "FAT_MAN", name: "胖子臉部", x: worldWidth * 0.28, y: worldHeight * 0.10, w: worldWidth * 0.14, h: worldHeight * 0.15 },
        // 胖子手臂與背心裸露處
        { category: "FAT_MAN", name: "胖子手臂", x: worldWidth * 0.24, y: worldHeight * 0.25, w: worldWidth * 0.18, h: worldHeight * 0.18 },
        // 胖子小腿
        { category: "FAT_MAN", name: "胖子小腿", x: worldWidth * 0.22, y: worldHeight * 0.58, w: worldWidth * 0.16, h: worldHeight * 0.26 },

        // ---------------- 3. 其他朋友 A (左一，白球衣朋友) ----------------
        { category: "OTHER_FRIEND", name: "白衣朋友臉部", x: worldWidth * 0.10, y: worldHeight * 0.11, w: worldWidth * 0.13, h: worldHeight * 0.15 },
        { category: "OTHER_FRIEND", name: "白衣朋友手臂", x: worldWidth * 0.07, y: worldHeight * 0.26, w: worldWidth * 0.14, h: worldHeight * 0.18 },
        { category: "OTHER_FRIEND", name: "白衣朋友小腿", x: worldWidth * 0.09, y: worldHeight * 0.58, w: worldWidth * 0.13, h: worldHeight * 0.27 },

        // ---------------- 3. 其他朋友 B (右一，灰衣朋友) ----------------
        { category: "OTHER_FRIEND", name: "灰衣朋友臉部", x: worldWidth * 0.67, y: worldHeight * 0.09, w: worldWidth * 0.12, h: worldHeight * 0.15 },
        { category: "OTHER_FRIEND", name: "灰衣朋友手臂", x: worldWidth * 0.65, y: worldHeight * 0.24, w: worldWidth * 0.12, h: worldHeight * 0.18 },
        { category: "OTHER_FRIEND", name: "灰衣朋友露出的腳踝", x: worldWidth * 0.68, y: worldHeight * 0.74, w: worldWidth * 0.10, h: worldHeight * 0.16 }
    ];
}

function getCurrentTarget() {
    const areas = getCharacterAreas();
    for (let a of areas) {
        if (mosquito.x >= a.x && mosquito.x <= a.x + a.w &&
            mosquito.y >= a.y && mosquito.y <= a.y + a.h) {
            return a;
        }
    }
    return null;
}

// 虛擬搖桿
const leftZone = document.getElementById("touch-left-zone");
const arenaJoy = document.getElementById("arena-joystick");
const arenaKnob = document.getElementById("arena-knob");
let joyActive = false;
let joyOrigin = { x: 0, y: 0 };
let currentTouchId = null;

function onJoyStart(clientX, clientY, touchId = null) {
    joyActive = true;
    currentTouchId = touchId;
    joyOrigin = { x: clientX, y: clientY };
    arenaJoy.style.left = clientX + "px";
    arenaJoy.style.top = clientY + "px";
    arenaJoy.style.display = "block";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

function onJoyMove(clientX, clientY) {
    if (!joyActive) return;
    let dx = clientX - joyOrigin.x;
    let dy = clientY - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    const maxRadius = 55;
    if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
    }
    arenaKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVector = { x: dx / maxRadius, y: dy / maxRadius };
}

function onJoyEnd() {
    joyActive = false;
    currentTouchId = null;
    arenaJoy.style.display = "none";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

leftZone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (joyActive) return;
    const t = e.changedTouches[0];
    onJoyStart(t.clientX, t.clientY, t.identifier);
});
window.addEventListener("touchmove", (e) => {
    if (!joyActive) return;
    for (let t of e.touches) {
        if (t.identifier === currentTouchId) {
            onJoyMove(t.clientX, t.clientY);
            break;
        }
    }
});
window.addEventListener("touchend", (e) => {
    if (!joyActive) return;
    for (let t of e.changedTouches) {
        if (t.identifier === currentTouchId) {
            onJoyEnd();
            break;
        }
    }
});

leftZone.addEventListener("mousedown", (e) => onJoyStart(e.clientX, e.clientY));
window.addEventListener("mousemove", (e) => { if (joyActive && currentTouchId === null) onJoyMove(e.clientX, e.clientY); });
window.addEventListener("mouseup", (e) => { if (joyActive && currentTouchId === null) onJoyEnd(); });

// 按鈕
const suckBtn = document.getElementById("suck-btn");
const skillBtn = document.getElementById("skill-btn");

function startSuck() { isSucking = true; suckBtn.classList.add("pressed"); }
function stopSuck() { isSucking = false; suckBtn.classList.remove("pressed"); }

suckBtn.addEventListener("mousedown", startSuck);
window.addEventListener("mouseup", stopSuck);
suckBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startSuck(); });
window.addEventListener("touchend", stopSuck);

skillBtn.addEventListener("click", () => {
    if (skillCooldown <= 0 && !isDashing) {
        isDashing = true;
        dashTime = 0.16;
        skillCooldown = 1.5;
        stopSuck();
    }
});

let lastTime = performance.now();
let suckTick = 0;

function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (skillCooldown > 0) {
        skillCooldown -= dt;
        skillBtn.innerText = skillCooldown > 0 ? skillCooldown.toFixed(1) : "💨 忍術";
        skillBtn.style.opacity = skillCooldown > 0 ? "0.6" : "1";
    }

    if (isDashing) {
        dashTime -= dt;
        mosquito.y -= mosquito.dashSpeed * dt;
        if (dashTime <= 0) isDashing = false;
    } else {
        if (joyVector.x !== 0 || joyVector.y !== 0) {
            mosquito.x += joyVector.x * mosquito.speed * dt;
            mosquito.y += joyVector.y * mosquito.speed * dt;
            
            if (joyVector.x > 0.05) {
                mosquito.facingRight = true;
            } else if (joyVector.x < -0.05) {
                mosquito.facingRight = false;
            }
            stopSuck();
        }
    }

    mosquito.x = Math.max(30, Math.min(worldWidth - 30, mosquito.x));
    mosquito.y = Math.max(30, Math.min(worldHeight - 30, mosquito.y));

    // 鏡頭鎖定
    const targetCamX = mosquito.x - (canvas.width / 2) / camera.zoom;
    const targetCamY = mosquito.y - (canvas.height / 2) / camera.zoom;
    camera.x += (targetCamX - camera.x) * 0.14;
    camera.y += (targetCamY - camera.y) * 0.14;

    mosquito.frameTimer += dt;
    if (mosquito.frameTimer > 0.09) {
        mosquito.frame = mosquito.frame === 0 ? 1 : 0;
        mosquito.frameTimer = 0;
    }

    const currentTarget = getCurrentTarget();
    const statusText = document.getElementById("status-text");

    if (isSucking) {
        suckTick += dt * 18;

        if (!currentTarget) {
            statusText.innerText = "❌ 咬到衣服或背景！無法吸血";
            statusText.style.color = "#bbb";
            alertVal = Math.max(0, alertVal - 10 * dt);
        } else if (currentTarget.category === "BIRTHDAY_BOY") {
            // 吸壽星：部位不同收益不同
            let gain = currentTarget.name.includes("臉") ? 36 : (currentTarget.name.includes("手") ? 25 : 16);
            let alertSpd = currentTarget.name.includes("臉") ? 40 : (currentTarget.name.includes("手") ? 24 : 14);
            essence = Math.min(100, essence + gain * dt);
            alertVal = Math.min(100, alertVal + alertSpd * dt);
            statusText.innerText = `🩸 正在汲取【${currentTarget.name}】純度精華！`;
            statusText.style.color = "#ff1744";

            if (Math.random() < 0.6) {
                _spawnBlood(mosquito.facingRight ? 11 : -11, 16, true);
            }
        } else if (currentTarget.category === "FAT_MAN") {
            health = Math.max(0, health - 35 * dt);
            alertVal = Math.min(100, alertVal + 60 * dt);
            statusText.innerText = "🌀 嘔！吸到胖子油膩毒血！生命受損！";
            statusText.style.color = "#00e676";
        } else if (currentTarget.category === "OTHER_FRIEND") {
            alertVal = Math.min(100, alertVal + 18 * dt);
            statusText.innerText = `🩸 正在叮咬【${currentTarget.name}】... 但精華無效！`;
            statusText.style.color = "#ff9100";

            if (Math.random() < 0.6) {
                _spawnBlood(mosquito.facingRight ? 11 : -11, 16, true);
            }
        }
    } else {
        alertVal = Math.max(0, alertVal - 12 * dt);
        if (currentTarget) {
            if (currentTarget.category === "BIRTHDAY_BOY") {
                statusText.innerText = `🟢 鎖定壽星部位：${currentTarget.name} (按住吸血)`;
                statusText.style.color = "#76ff03";
            } else if (currentTarget.category === "FAT_MAN") {
                statusText.innerText = `⚠️ 這是路人胖子！(${currentTarget.name} 別吸)`;
                statusText.style.color = "#ff5252";
            } else {
                statusText.innerText = `⚪ 發現目標：${currentTarget.name} (按住吸血)`;
                statusText.style.color = "#fff";
            }
        } else {
            statusText.innerText = "目標：探索合照尋找壽星";
            statusText.style.color = "#ffeb3b";
        }
    }

    // 血滴軌跡
    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        let p = bloodParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 100 * dt;
        p.alpha -= 2.5 * dt;
        if (p.alpha <= 0) bloodParticles.splice(i, 1);
    }

    document.getElementById("essence-bar").style.width = essence + "%";
    document.getElementById("health-bar").style.width = health + "%";
    document.getElementById("alert-bar").style.width = alertVal + "%";

    render(currentTarget);
    requestAnimationFrame(gameLoop);
}

function _spawnBlood(offsetX, offsetY, isRed) {
    bloodParticles.push({
        x: mosquito.x + offsetX,
        y: mosquito.y + offsetY,
        vx: (Math.random() - 0.5) * 45,
        vy: -Math.random() * 60 - 20,
        radius: Math.random() * 1.8 + 1.0,
        alpha: 1.0,
        isRed: isRed
    });
}

function render(currentTarget) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    if (assets.bg.complete) {
        ctx.drawImage(assets.bg, 0, 0, worldWidth, worldHeight);
    } else {
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, worldWidth, worldHeight);
    }

    // --- 若開啟「顯示熱區」，在畫面上把每個人身上的框框畫出來 ---
    if (showDebugBoxes) {
        const areas = getCharacterAreas();
        for (let a of areas) {
            ctx.save();
            if (a.category === "BIRTHDAY_BOY") {
                ctx.fillStyle = "rgba(76, 175, 80, 0.28)"; // 壽星綠色
                ctx.strokeStyle = "rgba(76, 175, 80, 0.9)";
            } else if (a.category === "FAT_MAN") {
                ctx.fillStyle = "rgba(244, 67, 54, 0.28)"; // 胖子紅色
                ctx.strokeStyle = "rgba(244, 67, 54, 0.9)";
            } else {
                ctx.fillStyle = "rgba(33, 150, 243, 0.28)"; // 其他人藍色
                ctx.strokeStyle = "rgba(33, 150, 243, 0.9)";
            }
            ctx.lineWidth = 2;
            ctx.fillRect(a.x, a.y, a.w, a.h);
            ctx.strokeRect(a.x, a.y, a.w, a.h);
            ctx.font = "14px sans-serif";
            ctx.fillStyle = "#fff";
            ctx.fillText(a.name, a.x + 4, a.y + 18);
            ctx.restore();
        }
    }

    // 針尖微型座標（配合 32px 尺寸縮小）
    const needleTipX = mosquito.x + (mosquito.facingRight ? 11 : -11);
    const needleTipY = mosquito.y + 16;

    // --- 吸血特效 ---
    if (isSucking && currentTarget) {
        if (currentTarget.category === "FAT_MAN") {
            ctx.beginPath();
            ctx.arc(needleTipX, needleTipY, 5, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 230, 118, 0.4)";
            ctx.fill();
        } else {
            const pulseRadius = 5 + Math.sin(suckTick * 1.5) * 1.5;
            ctx.beginPath();
            ctx.arc(needleTipX, needleTipY, pulseRadius + 3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 23, 68, 0.35)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(needleTipX, needleTipY, pulseRadius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 23, 68, 0.85)";
            ctx.fill();

            // 針管抽取光柱
            const barrelTopX = mosquito.x + (mosquito.facingRight ? 8 : -8);
            const barrelTopY = mosquito.y - 2;
            ctx.beginPath();
            ctx.moveTo(needleTipX, needleTipY);
            ctx.lineTo(barrelTopX, barrelTopY);
            ctx.lineWidth = 2.2 + Math.sin(suckTick * 2.0) * 0.6;
            ctx.strokeStyle = "rgba(255, 60, 60, 0.9)";
            ctx.stroke();

            // 血滴噴濺
            for (let p of bloodParticles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220, 20, 60, ${p.alpha})`;
                ctx.fill();
            }
        }
    }

    // --- 繪製縮小版蚊子本體 (32px) ---
    ctx.save();
    ctx.translate(mosquito.x, mosquito.y);
    
    if (mosquito.facingRight) {
        ctx.scale(1, 1);
    } else {
        ctx.scale(-1, 1);
    }

    let currentImg = assets.fly1;

    if (isSucking && currentTarget) {
        if (currentTarget.category === "FAT_MAN") {
            currentImg = assets.dizzy.complete ? assets.dizzy : assets.fly1;
            ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
        } else {
            currentImg = assets.suck.complete ? assets.suck : assets.fly1;
            ctx.translate(0, Math.sin(suckTick * 2.0) * 0.8);
        }
    } else {
        currentImg = mosquito.frame === 0 ? assets.fly1 : assets.fly2;
    }

    if (currentImg.complete) {
        ctx.drawImage(currentImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
    }
    ctx.restore();

    ctx.restore();
}

requestAnimationFrame(gameLoop);
</script>
