<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>忍者蚊子 - 壽星血宴</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 頂部 HUD (半透明懸浮) */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            left: 20px;
            width: 280px;
            max-width: 65vw;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 30;
        }
        #status-text {
            font-size: 16px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 6px;
            white-space: nowrap;
        }
        .bar-container {
            margin-bottom: 4px;
        }
        .bar-label {
            font-size: 11px;
            margin-bottom: 2px;
            color: #ddd;
        }
        .progress-bg {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            overflow: hidden;
        }
        #essence-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff1744, #ff5252);
        }
        #alert-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9100, #d50000);
        }

        /* 左半邊傳說對決式動態觸控層 */
        #touch-left-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 55vw;
            height: 100vh;
            z-index: 10;
            touch-action: none;
        }
        /* 傳說對決同款外底環 */
        #arena-joystick {
            position: absolute;
            width: 140px;
            height: 140px;
            margin-left: -70px;
            margin-top: -70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.45) 80%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: none;
            z-index: 15;
            transition: opacity 0.15s ease-out;
        }
        /* 傳說對決同款中心拖曳舵 */
        #arena-knob {
            position: absolute;
            width: 56px;
            height: 56px;
            top: 42px;
            left: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(200, 200, 200, 0.6) 100%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        /* 右側動作按鈕 (半透明懸浮在遊戲畫面上) */
        #action-container {
            position: absolute;
            right: 25px;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 25;
            touch-action: none;
        }
        .hud-btn {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            touch-action: none;
            transition: transform 0.08s ease, filter 0.1s ease;
        }
        #suck-btn {
            background: radial-gradient(circle, rgba(229, 57, 53, 0.8) 0%, rgba(183, 28, 28, 0.8) 100%);
            border: 2.5px solid rgba(255, 138, 128, 0.7);
            box-shadow: 0 0 16px rgba(211, 47, 47, 0.6);
        }
        #suck-btn:active, #suck-btn.pressed {
            transform: scale(0.9);
            filter: brightness(1.2);
            background: radial-gradient(circle, rgba(255, 23, 68, 0.95) 0%, rgba(213, 0, 0, 0.95) 100%);
        }
        #skill-btn {
            background: radial-gradient(circle, rgba(66, 66, 66, 0.75) 0%, rgba(33, 33, 33, 0.85) 100%);
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }
        #skill-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 滿版大地圖畫布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 傳說對決同款：左半邊任意點擊動態浮現輪盤 -->
    <div id="touch-left-zone"></div>
    <div id="arena-joystick">
        <div id="arena-knob"></div>
    </div>

    <!-- 頂部懸浮 HUD -->
    <div id="hud">
        <div id="status-text">目標：探索合照尋找壽星</div>
        <div class="bar-container">
            <div class="bar-label">壽星精華液</div>
            <div class="progress-bg"><div id="essence-bar"></div></div>
        </div>
        <div class="bar-container">
            <div class="bar-label">壽星警覺度</div>
            <div class="progress-bg"><div id="alert-bar"></div></div>
        </div>
    </div>

    <!-- 右側懸浮技能與吸血按鈕 -->
    <div id="action-container">
        <div id="suck-btn" class="hud-btn">💉 吸血</div>
        <div id="skill-btn" class="hud-btn">💨 忍術</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// 圖片資源
const assets = {
    bg: new Image(),
    fly1: new Image(),
    fly2: new Image(),
    dizzy: new Image()
};
assets.bg.src = "bg_level1.png";
assets.fly1.src = "mosquito_fly_1.png";
assets.fly2.src = "mosquito_fly_2.png";
assets.dizzy.src = "mosquito_dizzy.png";

let worldWidth = 1080;
let worldHeight = 1920;

assets.bg.onload = function() {
    worldWidth = assets.bg.naturalWidth || 1080;
    worldHeight = assets.bg.naturalHeight || 1920;
    // 預設將蚊子放置在壽星小腿附近的大地圖座標
    mosquito.x = worldWidth * 0.52;
    mosquito.y = worldHeight * 0.74;
};

// 鏡頭與蚊子設定
// zoom 拉大到 2.6：背景照片超級特寫放大，使人的腿看起來極其粗大，蚊子比例逼真！
const camera = { x: 0, y: 0, zoom: 2.6 };

const mosquito = {
    x: 550,
    y: 1300,
    size: 95,            // 蚊子在螢幕上維持舒適清晰的手感尺寸
    speed: 350,          // 平穩穩健的探索飛行速度
    dashSpeed: 2100,
    flipH: false,
    frame: 0,
    frameTimer: 0
};

let essence = 0;
let alertVal = 0;
let isSucking = false;
let isDashing = false;
let dashTime = 0;
let skillCooldown = 0;
let joyVector = { x: 0, y: 0 };

// 大地圖部位判定區
function getAreas() {
    return [
        { type: "LEG", name: "壽星小腿", x: worldWidth * 0.46, y: worldHeight * 0.65, w: worldWidth * 0.12, h: worldHeight * 0.22 },
        { type: "ARM", name: "壽星手臂", x: worldWidth * 0.56, y: worldHeight * 0.42, w: worldWidth * 0.12, h: worldHeight * 0.16 },
        { type: "FACE", name: "壽星臉部", x: worldWidth * 0.48, y: worldHeight * 0.24, w: worldWidth * 0.11, h: worldHeight * 0.12 },
        { type: "FAT_MAN", name: "胖子", x: worldWidth * 0.18, y: worldHeight * 0.32, w: worldWidth * 0.24, h: worldHeight * 0.52 }
    ];
}

function getTargetArea() {
    const areas = getAreas();
    for (let a of areas) {
        if (mosquito.x >= a.x && mosquito.x <= a.x + a.w &&
            mosquito.y >= a.y && mosquito.y <= a.y + a.h) {
            return a;
        }
    }
    return null;
}

// --- 傳說對決同款：左半邊任意點擊動態浮現輪盤 ---
const leftZone = document.getElementById("touch-left-zone");
const arenaJoy = document.getElementById("arena-joystick");
const arenaKnob = document.getElementById("arena-knob");
let joyActive = false;
let joyOrigin = { x: 0, y: 0 };
let currentTouchId = null;

function onJoyStart(clientX, clientY, touchId = null) {
    joyActive = true;
    currentTouchId = touchId;
    joyOrigin = { x: clientX, y: clientY };
    arenaJoy.style.left = clientX + "px";
    arenaJoy.style.top = clientY + "px";
    arenaJoy.style.display = "block";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

function onJoyMove(clientX, clientY) {
    if (!joyActive) return;
    let dx = clientX - joyOrigin.x;
    let dy = clientY - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    const maxRadius = 55;
    if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
    }
    arenaKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVector = { x: dx / maxRadius, y: dy / maxRadius };
}

function onJoyEnd() {
    joyActive = false;
    currentTouchId = null;
    arenaJoy.style.display = "none";
    arenaKnob.style.transform = "translate(0px, 0px)";
    joyVector = { x: 0, y: 0 };
}

leftZone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (joyActive) return;
    const t = e.changedTouches[0];
    onJoyStart(t.clientX, t.clientY, t.identifier);
});
window.addEventListener("touchmove", (e) => {
    if (!joyActive) return;
    for (let t of e.touches) {
        if (t.identifier === currentTouchId) {
            onJoyMove(t.clientX, t.clientY);
            break;
        }
    }
});
window.addEventListener("touchend", (e) => {
    if (!joyActive) return;
    for (let t of e.changedTouches) {
        if (t.identifier === currentTouchId) {
            onJoyEnd();
            break;
        }
    }
});

// 電腦滑鼠操作支援
leftZone.addEventListener("mousedown", (e) => onJoyStart(e.clientX, e.clientY));
window.addEventListener("mousemove", (e) => { if (joyActive && currentTouchId === null) onJoyMove(e.clientX, e.clientY); });
window.addEventListener("mouseup", (e) => { if (joyActive && currentTouchId === null) onJoyEnd(); });

// 按鈕事件
const suckBtn = document.getElementById("suck-btn");
const skillBtn = document.getElementById("skill-btn");

function startSuck() { isSucking = true; suckBtn.classList.add("pressed"); }
function stopSuck() { isSucking = false; suckBtn.classList.remove("pressed"); }

suckBtn.addEventListener("mousedown", startSuck);
window.addEventListener("mouseup", stopSuck);
suckBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startSuck(); });
window.addEventListener("touchend", stopSuck);

skillBtn.addEventListener("click", () => {
    if (skillCooldown <= 0 && !isDashing) {
        isDashing = true;
        dashTime = 0.16;
        skillCooldown = 1.5;
        stopSuck();
    }
});

// 主遊戲循環
let lastTime = performance.now();
let suckTick = 0;

function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (skillCooldown > 0) {
        skillCooldown -= dt;
        skillBtn.innerText = skillCooldown > 0 ? skillCooldown.toFixed(1) : "💨 忍術";
        skillBtn.style.opacity = skillCooldown > 0 ? "0.6" : "1";
    }

    if (isDashing) {
        dashTime -= dt;
        mosquito.y -= mosquito.dashSpeed * dt;
        if (dashTime <= 0) isDashing = false;
    } else {
        if (joyVector.x !== 0 || joyVector.y !== 0) {
            mosquito.x += joyVector.x * mosquito.speed * dt;
            mosquito.y += joyVector.y * mosquito.speed * dt;
            mosquito.flipH = joyVector.x > 0;
            stopSuck();
        }
    }

    mosquito.x = Math.max(60, Math.min(worldWidth - 60, mosquito.x));
    mosquito.y = Math.max(60, Math.min(worldHeight - 60, mosquito.y));

    // 鏡頭鎖定特寫平滑跟隨
    const targetCamX = mosquito.x - (canvas.width / 2) / camera.zoom;
    const targetCamY = mosquito.y - (canvas.height / 2) / camera.zoom;
    camera.x += (targetCamX - camera.x) * 0.14;
    camera.y += (targetCamY - camera.y) * 0.14;

    mosquito.frameTimer += dt;
    if (mosquito.frameTimer > 0.09) {
        mosquito.frame = mosquito.frame === 0 ? 1 : 0;
        mosquito.frameTimer = 0;
    }

    const currentTarget = getTargetArea();
    const statusText = document.getElementById("status-text");

    if (isSucking && currentTarget) {
        suckTick += dt * 18;
        if (currentTarget.type === "FAT_MAN") {
            essence = Math.max(0, essence - (essence * 0.5 + 20) * dt);
            alertVal = Math.min(100, alertVal + 65 * dt);
            statusText.innerText = "🌀 嘔！吸到胖子毒血！精華暴跌！";
            statusText.style.color = "#00e676";
        } else {
            let gain = currentTarget.type === "FACE" ? 36 : (currentTarget.type === "ARM" ? 22 : 14);
            let alertSpeed = currentTarget.type === "FACE" ? 42 : (currentTarget.type === "ARM" ? 22 : 12);
            essence = Math.min(100, essence + gain * dt);
            alertVal = Math.min(100, alertVal + alertSpeed * dt);
            statusText.innerText = `🩸 正在汲取【${currentTarget.name}】！`;
            statusText.style.color = "#ff1744";
        }
    } else {
        alertVal = Math.max(0, alertVal - 12 * dt);
        if (currentTarget) {
            statusText.innerText = currentTarget.type === "FAT_MAN" ? "⚠️ 鎖定到胖子！別吸！" : `🟢 已就位：${currentTarget.name} (按住吸血)`;
            statusText.style.color = currentTarget.type === "FAT_MAN" ? "#ff9100" : "#76ff03";
        } else {
            statusText.innerText = "目標：探索合照尋找壽星";
            statusText.style.color = "#ffeb3b";
        }
    }

    document.getElementById("essence-bar").style.width = essence + "%";
    document.getElementById("alert-bar").style.width = alertVal + "%";

    render(currentTarget);
    requestAnimationFrame(gameLoop);
}

function render(currentTarget) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    // 1. 繪製特寫大地圖合照
    if (assets.bg.complete) {
        ctx.drawImage(assets.bg, 0, 0, worldWidth, worldHeight);
    } else {
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, worldWidth, worldHeight);
    }

    // 2. 吸血流動光柱特效
    if (isSucking && currentTarget) {
        const mouthX = mosquito.x;
        const mouthY = mosquito.y + 32;
        const skinX = mosquito.x;
        const skinY = mosquito.y + 68;
        const isRed = currentTarget.type !== "FAT_MAN";

        ctx.beginPath();
        ctx.arc(skinX, skinY, 16, 0, Math.PI * 2);
        ctx.fillStyle = isRed ? "rgba(255, 23, 68, 0.45)" : "rgba(0, 230, 118, 0.45)";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(skinX, skinY);
        ctx.lineTo(mouthX, mouthY);
        ctx.lineWidth = 8 + Math.sin(suckTick) * 2;
        ctx.strokeStyle = isRed ? "rgba(255, 23, 68, 0.9)" : "rgba(0, 230, 118, 0.9)";
        ctx.stroke();

        for (let i = 0; i < 3; i++) {
            let t = ((suckTick * 0.12) + i * 0.33) % 1;
            let px = skinX + (mouthX - skinX) * t;
            let py = skinY + (mouthY - skinY) * t;
            ctx.beginPath();
            ctx.arc(px, py, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
        }
    }

    // 3. 繪製蚊子
    ctx.save();
    ctx.translate(mosquito.x, mosquito.y);
    if (mosquito.flipH) ctx.scale(-1, 1);

    let currentImg = assets.fly1;
    if (isSucking && currentTarget && currentTarget.type === "FAT_MAN") {
        currentImg = assets.dizzy.complete ? assets.dizzy : assets.fly1;
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    } else {
        currentImg = mosquito.frame === 0 ? assets.fly1 : assets.fly2;
    }

    if (currentImg.complete) {
        ctx.drawImage(currentImg, -mosquito.size / 2, -mosquito.size / 2, mosquito.size, mosquito.size);
    }
    ctx.restore();

    ctx.restore();
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
